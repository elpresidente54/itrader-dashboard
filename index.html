<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itrader Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; display: flex; align-items: center;
    justify-content: center; min-height: 100vh;
  }
  .lock-box {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 40px; max-width: 380px; width: 100%; text-align: center;
  }
  .lock-box h1 { font-size: 18px; margin-bottom: 6px; color: #e6edf3; }
  .lock-box p { font-size: 12px; color: #8b949e; margin-bottom: 24px; }
  .lock-box input {
    width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid #30363d;
    background: #0d1117; color: #e6edf3; font-size: 14px; outline: none;
    margin-bottom: 16px;
  }
  .lock-box input:focus { border-color: #58a6ff; }
  .lock-box button {
    width: 100%; padding: 10px; border-radius: 6px; border: none;
    background: #238636; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .lock-box button:hover { background: #2ea043; }
  .lock-box .error { color: #f85149; font-size: 12px; margin-top: 12px; display: none; }
  .lock-icon { font-size: 36px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="lock-box" id="login">
  <div class="lock-icon">&#x1F512;</div>
  <h1>Dashboard Locked</h1>
  <p>Enter passphrase to decrypt</p>
  <form id="unlock-form">
    <input type="password" id="passphrase" placeholder="Passphrase" autocomplete="off" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div class="error" id="err">Incorrect passphrase</div>
</div>

async function decrypt(passphrase) {
  var raw = Uint8Array.from(atob(ENCRYPTED), function(c) { return c.charCodeAt(0); });
  var salt = raw.slice(0, 16);
  var iv = raw.slice(16, 28);
  var ct = raw.slice(28);

  var keyMaterial = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]
  );
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );

  var decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
  return new TextDecoder().decode(decrypted);
}

document.getElementById("unlock-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  var pw = document.getElementById("passphrase").value;
  if (!pw) return;
  try {
    var html = await decrypt(pw);
    // Replace entire document with decrypted dashboard
    document.open();
    document.write(html);
    document.close();
  } catch(err) {
    document.getElementById("err").style.display = "block";
    document.getElementById("passphrase").value = "";
    document.getElementById("passphrase").focus();
  }
});
