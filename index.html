<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Alpha — Live Dashboard</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922; --orange: #db6d28;
  --purple: #bc8cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; background: var(--bg); color: var(--text); font-size: 13px; }

/* ── Top bar ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: 1.5px; color: var(--accent); }
.topbar .meta { font-size: 11px; color: var(--text2); }
.status-pill {
  display: inline-block; padding: 4px 14px; border-radius: 12px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.status-running { background: rgba(63,185,80,0.15); color: var(--green); }
.status-paused { background: rgba(210,153,34,0.15); color: var(--yellow); }
.status-stopped { background: rgba(248,81,73,0.15); color: var(--red); }
.status-offline { background: rgba(139,148,158,0.15); color: var(--text2); }

/* ── Leaf tabs ── */
.leaf-tabs {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 16px; gap: 2px;
}
.leaf-tab {
  padding: 10px 20px; cursor: pointer; font-size: 12px; font-weight: 600;
  color: var(--text2); border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.leaf-tab:hover { color: var(--text); background: rgba(88,166,255,0.04); }
.leaf-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.leaf-tab .dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px;
}
.leaf-tab .dot.alive { background: var(--green); }
.leaf-tab .dot.dead { background: var(--red); }
.leaf-tab.tab-overview { color: var(--purple); }
.leaf-tab.tab-overview.active { color: var(--purple); border-bottom-color: var(--purple); }

/* ── Regime & Benchmark bar ── */
.shared-bar {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 20px; gap: 24px; align-items: center; font-size: 12px;
}
.shared-bar .label { color: var(--text2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.regime-badge {
  display: inline-block; padding: 3px 12px; border-radius: 10px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
}
.regime-risk_on { background: rgba(63,185,80,0.15); color: var(--green); }
.regime-choppy { background: rgba(210,153,34,0.15); color: var(--yellow); }
.regime-risk_off { background: rgba(248,81,73,0.15); color: var(--red); }
.prob-bar {
  display: inline-block; height: 6px; border-radius: 3px; vertical-align: middle;
}
.bench-item { display: flex; flex-direction: column; gap: 2px; }
.bench-val { font-weight: 600; font-size: 13px; }

/* ── Metrics row ── */
.metrics {
  display: flex; border-bottom: 1px solid var(--border);
}
.metric {
  flex: 1; padding: 16px 20px; background: var(--surface);
  border-right: 1px solid var(--border);
}
.metric:last-child { border-right: none; }
.metric label { display: block; font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.metric .val { font-size: 22px; font-weight: 700; }
.green { color: var(--green); }
.red { color: var(--red); }
.yellow { color: var(--yellow); }

/* ── Grid layout ── */
.grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--border);
}
.grid > section { background: var(--surface); padding: 16px 20px; }
.grid.three { grid-template-columns: 1fr 1fr 1fr; }

section h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ── Tables ── */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--text2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 8px 8px 0; }
td { padding: 5px 8px 5px 0; border-top: 1px solid rgba(48,54,61,0.5); white-space: nowrap; }
tr:hover td { background: rgba(88,166,255,0.04); }

/* ── Signal bar ── */
.signal-bar {
  display: inline-block; height: 8px; border-radius: 4px; min-width: 2px; vertical-align: middle;
}
.signal-pos { background: var(--green); }
.signal-neg { background: var(--red); }

/* ── Log pane ── */
.log-pane {
  background: var(--bg); padding: 12px 16px;
  max-height: 300px; overflow-y: auto;
  font-size: 11px; line-height: 1.6;
  border-top: 1px solid var(--border);
}
.log-pane .line { color: var(--text2); }
.log-pane .line.warn { color: var(--yellow); }
.log-pane .line.err { color: var(--red); }
.log-pane .line.buy { color: var(--green); }
.log-pane .line.sell { color: var(--orange); }

/* ── Memory ── */
.memory-pane {
  background: var(--bg); padding: 12px 16px; font-size: 12px;
  line-height: 1.7; color: var(--text2); white-space: pre-wrap; max-height: 400px; overflow-y: auto;
}
.memory-pane h1, .memory-pane h2, .memory-pane h3 { color: var(--accent); font-size: 13px; margin: 8px 0 4px; }

/* ── Full width ── */
.full { grid-column: 1 / -1; }

/* ── Equity chart ── */
.chart-wrap {
  background: var(--surface); padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.chart-wrap h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.chart-svg { width: 100%; }
.chart-grid { stroke: var(--border); stroke-width: 0.5; }
.chart-axis-label { fill: var(--text2); font-size: 10px; font-family: inherit; }
.chart-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart-area { opacity: 0.08; }
.chart-dot { r: 3; opacity: 0; transition: opacity 0.15s; }
.chart-dot:hover { opacity: 1; }
.chart-baseline { stroke: var(--text2); stroke-width: 0.5; stroke-dasharray: 4 3; }
.chart-tooltip {
  position: absolute; background: var(--surface); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 6px; font-size: 11px; pointer-events: none;
  color: var(--text); display: none; z-index: 10; white-space: nowrap;
}

/* ── Leaf content panes (tab switching) ── */
.leaf-pane { display: none; }
.leaf-pane.active { display: block; }

/* ── Overview comparison table ── */
.overview-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1px; background: var(--border);
}
.overview-grid > .leaf-card {
  background: var(--surface); padding: 20px;
}
.leaf-card h3 {
  font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 12px;
}
.leaf-card .leaf-type {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text2); margin-left: 8px;
}

/* ── Footer ── */
.footer {
  padding: 8px 24px; font-size: 10px; color: var(--text2);
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; justify-content: space-between;
}

/* ── Sentiment & Sector ── */
.sentiment-table { width: 100%; }
.sentiment-row { display: flex; align-items: center; padding: 4px 0; }
.sentiment-badge {
  display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
.sentiment-green { background: var(--green); }
.sentiment-red { background: var(--red); }
.sentiment-neutral { background: var(--text2); }

.sector-bar {
  display: flex; height: 24px; border-radius: 4px; overflow: hidden;
  margin: 12px 0; border: 1px solid var(--border);
}
.sector-segment {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #fff; transition: opacity 0.15s;
}
.sector-segment:hover { opacity: 0.8; }
.sector-tech { background: #7b61ff; }
.sector-energy { background: #ff6b6b; }
.sector-healthcare { background: #51cf66; }
.sector-consumer { background: #ffa500; }
.sector-industrial { background: #4c72b0; }
.sector-index { background: #9467bd; }
.sector-leveraged { background: #d62728; }
.sector-crypto { background: #ff7f0e; }

.signal-expand {
  cursor: pointer; padding: 4px 8px; border-radius: 4px;
  font-size: 10px; background: rgba(88,166,255,0.1); color: var(--accent);
  margin-top: 4px; display: inline-block;
}
.signal-meta {
  padding: 6px 8px; margin-top: 4px; border-radius: 4px;
  background: rgba(139,148,158,0.1); color: var(--text2);
  font-size: 10px; white-space: normal; font-family: inherit;
  line-height: 1.4;
}

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  body { font-size: 12px; }

  /* Top bar: stack vertically */
  .topbar {
    flex-direction: column; align-items: flex-start; gap: 6px;
    padding: 10px 14px;
  }
  .topbar h1 { font-size: 14px; }

  /* Shared bar (regime + market): stack vertically */
  .shared-bar {
    flex-direction: column; gap: 10px; padding: 10px 14px;
    align-items: flex-start;
  }
  .shared-bar > div { width: 100%; }
  .shared-bar > div:last-child {
    flex-direction: column !important; align-items: flex-start !important;
    gap: 8px !important;
  }
  #market-status { text-align: left !important; }

  /* Leaf tabs: horizontal scroll */
  .leaf-tabs {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 0 8px; gap: 0;
    scrollbar-width: none;
  }
  .leaf-tabs::-webkit-scrollbar { display: none; }
  .leaf-tab {
    padding: 8px 12px; font-size: 11px;
    white-space: nowrap; flex-shrink: 0;
  }

  /* Metrics row: wrap into 2-col grid */
  .metrics {
    flex-wrap: wrap;
  }
  .metric {
    flex: 1 1 45%; padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .metric .val { font-size: 18px; }

  /* Grid panels: single column */
  .grid { grid-template-columns: 1fr; }
  .grid.three { grid-template-columns: 1fr; }
  .grid > section { padding: 12px 14px; }

  /* Tables: horizontal scroll */
  table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  td { white-space: nowrap; padding: 4px 6px 4px 0; font-size: 11px; }
  th { padding: 3px 6px 6px 0; font-size: 9px; }
  td[style*="max-width"] { max-width: 200px !important; white-space: normal !important; }

  /* Overview cards: single column */
  .overview-grid { grid-template-columns: 1fr; }
  .overview-grid > .leaf-card { padding: 14px; }
  .leaf-card h3 { font-size: 13px; }

  /* Chart */
  .chart-wrap { padding: 12px 10px; }

  /* Sector bar segments: allow label overflow */
  .sector-segment { min-width: 30px !important; font-size: 9px; }

  /* Footer */
  .footer {
    flex-direction: column; gap: 4px; padding: 8px 14px;
    text-align: center;
  }

  /* Log pane */
  .log-pane { padding: 8px 10px; font-size: 10px; }

  /* Memory pane */
  .memory-pane { padding: 8px 10px; font-size: 11px; }
}

/* ── Small phone ── */
@media (max-width: 400px) {
  .topbar h1 { font-size: 12px; letter-spacing: 1px; }
  .metric { flex: 1 1 100%; }
  .metric .val { font-size: 16px; }
  .leaf-tab { padding: 6px 10px; font-size: 10px; }
  .regime-badge { font-size: 10px; padding: 2px 8px; }
}
</style>

function fmt(n, dec=2) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtUsd(n) { return '$' + fmt(n); }
function pct(n) { return (n >= 0 ? '+' : '') + fmt(n * 100, 2) + '%'; }
function clr(n) { return n >= 0 ? 'green' : 'red'; }
function signalBar(v) {
  const w = Math.min(Math.abs(v) * 60, 60);
  const cls = v >= 0 ? 'signal-pos' : 'signal-neg';
  return '<span class="signal-bar ' + cls + '" style="width:' + w + 'px"></span>';
}
function ago(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function esc(s) { return (s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ── Tooltip helpers ──
function showTip(evt, text) {
  const tip = document.getElementById('chart-tooltip');
  if (!tip) return;
  tip.textContent = text;
  tip.style.display = 'block';
  const rect = evt.target.closest('.chart-wrap').getBoundingClientRect();
  tip.style.left = (evt.clientX - rect.left + 12) + 'px';
  tip.style.top = (evt.clientY - rect.top - 28) + 'px';
}
function hideTip() {
  const tip = document.getElementById('chart-tooltip');
  if (tip) tip.style.display = 'none';
}

function getSector(symbol) {
  const tech = ['AAPL', 'MSFT', 'GOOGL', 'AMZN', 'META', 'NVDA', 'MU', 'INTC'];
  const energy = ['XOM', 'CVX', 'COP', 'EOG', 'XLE'];
  const healthcare = ['LLY', 'MRK', 'JNJ'];
  const consumer = ['KO', 'PG', 'COST', 'SBUX'];
  const industrial = ['CAT', 'UNP', 'LMT', 'RTX'];
  const indexEtf = ['SPY', 'QQQ', 'IWM'];
  const leveraged = ['TQQQ', 'UCO'];
  const sym = (symbol || '').toUpperCase();

  if (tech.includes(sym)) return 'tech';
  if (energy.includes(sym)) return 'energy';
  if (healthcare.includes(sym)) return 'healthcare';
  if (consumer.includes(sym)) return 'consumer';
  if (industrial.includes(sym)) return 'industrial';
  if (indexEtf.includes(sym)) return 'index';
  if (leveraged.includes(sym)) return 'leveraged';
  if (sym.includes('/USD') || sym === 'BTC' || sym === 'ETH') return 'crypto';
  return 'other';
}

// ── Tab switching ──
function switchTab(tabId) {
  document.querySelectorAll('.leaf-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.leaf-pane').forEach(p => p.classList.remove('active'));
  const tab = document.querySelector('[data-tab="' + tabId + '"]');
  const pane = document.getElementById('pane-' + tabId);
  if (tab) tab.classList.add('active');

}

      html += '<td>' + shares + '</td>';
      html += '<td>' + fmtUsd(t.price || 0) + '</td>';
      html += '<td class="' + (hasPnl ? clr(tPnl) : '') + '">' + (hasPnl ? fmtUsd(tPnl) : '—') + '</td>';
      html += '<td style="white-space:normal;max-width:350px">' + tFactorHtml + '</td>';
      html += '</tr>';
    }
    html += '</table>';
  }
  html += '</section>';

  // Sector Exposure (pairs with Trades in 2-col grid when positions exist)
  if (posCount > 0) {
    html += '<section>';
    html += '<h2>Sector Exposure</h2>';

    const sectorValues = {};
    let totalValue = 0;
    for (const [sym, p] of Object.entries(positions)) {
      const sector = getSector(sym);
      const mv = p.market_value || 0;
      sectorValues[sector] = (sectorValues[sector] || 0) + mv;
      totalValue += mv;
    }

    if (totalValue > 0) {
      html += '<div class="sector-bar">';
      const sectorOrder = ['tech', 'energy', 'healthcare', 'consumer', 'industrial', 'index', 'leveraged', 'crypto'];
      for (const sector of sectorOrder) {
        const val = sectorValues[sector] || 0;
        if (val > 0) {
          const pct = (val / totalValue * 100).toFixed(1);
          html += '<div class="sector-segment sector-' + sector + '" style="flex:' + (val / totalValue) + ';min-width:40px">'
            + esc(sector.charAt(0).toUpperCase() + sector.slice(1)) + ' ' + pct + '%</div>';
        }
      }
      html += '</div>';
    } else {
      html += '<div style="color:var(--text2)">No sector data</div>';
    }

    html += '</section>';
  }

  // Signals
  html += '<section>';
  const latestBySymbol = {};
  for (const p of recentPreds) { latestBySymbol[p.symbol] = p; }
  const dedupedPreds = Object.values(latestBySymbol).sort((a, b) => Math.abs(b.signal || 0) - Math.abs(a.signal || 0));
  const activeSignals = dedupedPreds.filter(p => Math.abs(p.signal || 0) > 0.001);
  const zeroCount = dedupedPreds.length - activeSignals.length;

  html += '<h2>Latest Signals (' + activeSignals.length + ' active, ' + zeroCount + ' flat)</h2>';
  if (dedupedPreds.length === 0) {
    html += '<div style="color:var(--text2)">No signals yet</div>';
  } else {
    html += '<table><tr><th>Symbol</th><th>Signal</th><th></th><th>Factors</th><th>Time</th></tr>';
    for (const p of dedupedPreds) {
      const sig = p.signal || 0;
      const factors = (p.meta && p.meta.factors) ? p.meta.factors : [];
      const reason = (p.meta && p.meta.reason) ? p.meta.reason : '';
      const meta = p.meta || {};
      const factorHtml = factors.length > 0
        ? factors.map(f => '<span style="display:inline-block;padding:1px 6px;margin:1px 2px;border-radius:8px;font-size:9px;background:rgba(88,166,255,0.1);color:var(--accent)">'
          + esc(f.name) + ' <span class="' + clr(f.delta || 0) + '">' + (f.delta >= 0 ? '+' : '') + (f.delta || 0).toFixed(2) + '</span>'
          + (f.conviction != null ? ' <span style="opacity:0.5">' + Math.round(f.conviction * 100) + '%</span>' : '')
          + '</span>').join('')
        : '<span style="color:var(--text2);font-size:10px">' + esc(reason) + '</span>';
      const dimStyle = Math.abs(sig) < 0.001 ? ' style="opacity:0.35"' : '';

      // Improvement 2: Show expandable meta for signals > 0.01
      const hasMeta = Math.abs(sig) > 0.01 && (meta.mode || meta.rsi != null || meta.bb_pct != null || meta.ema20_dev != null || meta.regime_mult != null);
      const expandId = 'meta-' + (p.symbol || '?') + '-' + (Math.random().toString(36).substr(2, 9));

      html += '<tr' + dimStyle + '>';
      html += '<td style="font-weight:600">' + (p.symbol || '?') + '</td>';
      html += '<td class="' + clr(sig) + '">' + (sig >= 0 ? '+' : '') + sig.toFixed(3) + '</td>';
      html += '<td>' + signalBar(sig) + '</td>';
      html += '<td style="white-space:normal;max-width:400px">' + factorHtml + '</td>';
      html += '<td style="color:var(--text2)">' + ago(p.timestamp) + '</td>';
      html += '</tr>';

      if (hasMeta) {
        let metaText = '';
        if (meta.mode) metaText += 'mode=' + esc(meta.mode) + ' ';
        if (meta.rsi != null) metaText += 'rsi=' + meta.rsi.toFixed(1) + ' ';
        if (meta.bb_pct != null) metaText += 'bb_pct=' + meta.bb_pct.toFixed(2) + ' ';
        if (meta.ema20_dev != null) metaText += 'ema20_dev=' + meta.ema20_dev.toFixed(3) + ' ';
        if (meta.regime_mult != null) metaText += 'regime_mult=' + meta.regime_mult.toFixed(2) + ' ';
        if (meta.symbol_sentiment != null) metaText += 'sentiment=' + meta.symbol_sentiment.toFixed(2) + ' ';

        html += '<tr style="opacity:0.5">';
        html += '<td colspan="5"><div class="signal-meta">' + esc(metaText.trim()) + '</div></td>';
        html += '</tr>';
      }
    }
    html += '</table>';
  }
  html += '</section>';

  // Risk Matrix (pairs with Signals in 2-col grid)
  html += '<section>';
  const regime = S.regime || {};
  const rSignals = regime.signals || {};
  const rProbs = regime.probabilities || {};
  const regimeLabel = (regime.regime || 'unknown').replace('_', ' ');
  const regimeCls = 'regime-' + (regime.regime || 'unknown');

  html += '<h2>Risk Matrix</h2>';

  // Regime badge
  html += '<div style="margin-bottom:12px"><span class="regime-badge ' + regimeCls + '" style="font-size:13px;padding:4px 12px">'
    + regimeLabel.charAt(0).toUpperCase() + regimeLabel.slice(1) + '</span></div>';

  // Regime probabilities bar
  const rOn = ((rProbs.risk_on || 0) * 100);
  const rCh = ((rProbs.choppy || 0) * 100);
  const rOff = ((rProbs.risk_off || 0) * 100);
  html += '<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:14px">';
  html += '<div style="width:' + rOn + '%;background:var(--green)" title="Risk On ' + rOn.toFixed(0) + '%"></div>';
  html += '<div style="width:' + rCh + '%;background:var(--yellow)" title="Choppy ' + rCh.toFixed(0) + '%"></div>';
  html += '<div style="width:' + rOff + '%;background:var(--red)" title="Risk Off ' + rOff.toFixed(0) + '%"></div>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-bottom:14px">';
  html += '<span class="green">On ' + rOn.toFixed(0) + '%</span>';
  html += '<span style="color:var(--yellow)">Choppy ' + rCh.toFixed(0) + '%</span>';
  html += '<span class="red">Off ' + rOff.toFixed(0) + '%</span>';
  html += '</div>';

  // Key risk signals
  html += '<table>';
  if (rSignals.vix != null) {
    const vixClr = rSignals.vix > 25 ? 'red' : rSignals.vix > 18 ? 'style="color:var(--yellow)"' : 'green';
    const vixAttr = vixClr.startsWith('style') ? vixClr : 'class="' + vixClr + '"';
    html += '<tr><td style="color:var(--text2)">VIX</td><td ' + vixAttr + ' style="font-weight:600">' + fmt(rSignals.vix, 1) + '</td></tr>';
  }
  if (rSignals.vix_percentile != null) {
    html += '<tr><td style="color:var(--text2)">VIX Percentile</td><td>' + rSignals.vix_percentile + 'th</td></tr>';
  }
  if (rSignals.fear_greed != null) {
    const fgVal = rSignals.fear_greed;
    const fgLabel = fgVal <= 25 ? 'Extreme Fear' : fgVal <= 40 ? 'Fear' : fgVal <= 60 ? 'Neutral' : fgVal <= 75 ? 'Greed' : 'Extreme Greed';
    const fgClr = fgVal <= 25 ? 'red' : fgVal <= 40 ? 'style="color:var(--yellow)"' : fgVal <= 60 ? '' : fgVal <= 75 ? 'green' : 'green';
    const fgAttr = fgClr.startsWith('style') ? fgClr : (fgClr ? 'class="' + fgClr + '"' : '');
    html += '<tr><td style="color:var(--text2)">Fear & Greed</td><td ' + fgAttr + '>' + fgVal + ' <span style="opacity:0.5;font-size:10px">' + fgLabel + '</span></td></tr>';
  }
  if (rSignals.spy_trend_score != null) {
    html += '<tr><td style="color:var(--text2)">SPY Trend</td><td class="' + clr(rSignals.spy_trend_score) + '">' + rSignals.spy_trend_score + '</td></tr>';
  }
  if (rSignals.btc_dominance != null) {
    html += '<tr><td style="color:var(--text2)">BTC Dominance</td><td>' + fmt(rSignals.btc_dominance, 1) + '%</td></tr>';
  }

  // Exposure limits from cadence
  html += '<tr style="border-top:1px solid var(--border)"><td style="color:var(--text2);padding-top:8px">Max Exposure</td><td style="padding-top:8px">' + ((cadence.max_exposure_pct || 0) * 100).toFixed(0) + '%</td></tr>';
  html += '<tr><td style="color:var(--text2)">Max Positions</td><td>' + (cadence.max_positions || '—') + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Position Size</td><td>' + ((cadence.position_size_pct || 0) * 100).toFixed(0) + '%</td></tr>';
  html += '<tr><td style="color:var(--text2)">Stop Loss (Stock)</td><td>' + ((cadence.stop_loss_pct_stock || 0) * 100).toFixed(1) + '%</td></tr>';
  html += '<tr><td style="color:var(--text2)">Stop Loss (Crypto)</td><td>' + ((cadence.stop_loss_pct_crypto || 0) * 100).toFixed(1) + '%</td></tr>';

  // Drawdown
  html += '<tr style="border-top:1px solid var(--border)"><td style="color:var(--text2);padding-top:8px">Drawdown</td><td style="padding-top:8px" class="' + clr(dd) + '">' + (dd * 100).toFixed(2) + '%</td></tr>';
  html += '</table>';
  html += '</section>';

  // News Sentiment (Improvement 1)
  html += '<section class="full">';
  const sentimentData = (L.sentiment_cache || {}).data || {};
  const sentimentTs = (L.sentiment_cache || {}).ts || null;
  const symbols = sentimentData.symbols || {};
  const symbolsWithArticles = Object.entries(symbols).filter(([sym, data]) => (data.article_count || 0) > 0);

  html += '<h2>News Sentiment</h2>';
  if (sentimentTs) {
    html += '<div style="font-size:10px;color:var(--text2);margin-bottom:12px">Cache: ' + ago(sentimentTs * 1000) + '</div>';
  }
  if (symbolsWithArticles.length === 0) {
    html += '<div style="color:var(--text2)">No sentiment data yet</div>';
  } else {
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px">';
    for (const [sym, data] of symbolsWithArticles.slice(0, 20)) {
      const sent = data.sentiment || 0;
      let sentColor = 'sentiment-neutral';
      if (sent > 0.05) sentColor = 'sentiment-green';
      else if (sent < -0.05) sentColor = 'sentiment-red';

      html += '<div style="padding:8px;border:1px solid var(--border);border-radius:4px;background:rgba(139,148,158,0.05)">';
      html += '<div style="font-weight:600;margin-bottom:4px">' + sym + '</div>';
      html += '<div style="font-size:11px;line-height:1.6">';
      html += '<div><span class="sentiment-badge ' + sentColor + '"></span>Sentiment: <span class="' + (sent >= 0 ? 'green' : 'red') + '">' + (sent >= 0 ? '+' : '') + (sent * 100).toFixed(1) + '%</span></div>';
      html += '<div>Buzz: ' + esc(data.buzz || 'none') + '</div>';
      html += '<div>Articles: ' + (data.article_count || 0) + '</div>';
      html += '</div></div>';
    }
    html += '</div>';
  }
  html += '</section>';

  // Brain / Config (Improvement 4: Add Latest Backtest)
  html += '<section>';
  html += '<h2>Configuration</h2>';
  html += '<table>';
  html += '<tr><td style="color:var(--text2)">Generation</td><td style="font-weight:600">' + (brain.generation || 0) + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Thesis</td><td style="white-space:normal">' + esc(brain.thesis || '—') + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Last Changed</td><td>' + (brain.last_changed || '—') + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Scan Interval</td><td>' + (cadence.scan_interval_seconds || '—') + 's</td></tr>';
  html += '<tr><td style="color:var(--text2)">Data Interval</td><td>' + (cadence.data_interval || '—') + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Data Period</td><td>' + (cadence.data_period || '—') + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Hold Bars</td><td>' + (cadence.hold_bars || '—') + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Market Hours Only</td><td>' + (cadence.market_hours_only ? 'Yes' : 'No') + '</td></tr>';
  html += '<tr><td style="color:var(--text2)">Reflect Every</td><td>' + (cadence.reflect_every_n_cycles || '—') + ' cycles</td></tr>';

  const backtest = L.latest_backtest || {};
  if (Object.keys(backtest).length > 0) {
    html += '<tr style="border-top:1px solid var(--border);padding-top:8px;"><td colspan="2" style="color:var(--accent);font-weight:600;padding-top:12px">Latest Backtest</td></tr>';
    html += '<tr><td style="color:var(--text2)">Return</td><td class="' + clr(backtest.total_return_pct || 0) + '" style="font-weight:600">' + (backtest.total_return_pct != null ? (backtest.total_return_pct >= 0 ? '+' : '') + fmt(backtest.total_return_pct, 2) + '%' : '—') + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Sharpe</td><td>' + (backtest.sharpe_ratio != null ? fmt(backtest.sharpe_ratio, 2) : '—') + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Profit Factor</td><td>' + (backtest.profit_factor != null ? fmt(backtest.profit_factor, 2) : '—') + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Win Rate</td><td>' + (backtest.win_rate_pct != null ? fmt(backtest.win_rate_pct, 1) + '%' : '—') + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Trades</td><td>' + (backtest.total_trades || 0) + '</td></tr>';

    const gateStats = brain.sentiment_gate_stats || {};
    if (Object.keys(gateStats).length > 0) {
      html += '<tr style="border-top:1px solid var(--border)"><td style="color:var(--accent);font-weight:600;padding-top:12px">Sentiment Gate</td><td></td></tr>';
      html += '<tr><td style="color:var(--text2)">Activations</td><td>' + (gateStats.total_activations || 0) + '</td></tr>';
      html += '<tr><td style="color:var(--text2)">Boosted</td><td class="green">' + (gateStats.boosted_entries || 0) + '</td></tr>';
      html += '<tr><td style="color:var(--text2)">Dampened</td><td style="color:var(--text2)">' + (gateStats.dampened_entries || 0) + '</td></tr>';
      html += '<tr><td style="color:var(--text2)">Blocked</td><td class="red">' + (gateStats.blocked_entries || 0) + '</td></tr>';
    }
  }

  html += '</table>';
  html += '</section>';

  // Universe
  html += '<section>';
  html += '<h2>Universe (' + activeSymbols.length + ' active)</h2>';
  html += '<table><tr><th>Symbol</th><th>Max Alloc</th><th>Note</th></tr>';
  for (const inst of (universe.active || [])) {
    const sym = typeof inst === 'string' ? inst : inst.symbol;
    const alloc = typeof inst === 'object' ? (inst.max_alloc_pct || '—') : '—';
    const note = typeof inst === 'object' ? (inst.note || '') : '';
    html += '<tr>';
    html += '<td style="font-weight:600">' + sym + '</td>';
    html += '<td>' + alloc + '%</td>';
    html += '<td style="color:var(--text2);white-space:normal;max-width:300px">' + esc(note) + '</td>';
    html += '</tr>';
  }
  html += '</table>';
  html += '</section>';

  // Reflections
  html += '<section class="full">';
  html += '<h2>Reflection History</h2>';
  const refs = L.reflections || [];
  if (refs.length === 0) {
    html += '<div style="color:var(--text2)">No reflections yet</div>';
  } else {
    html += '<table><tr><th>Time</th><th>Gen</th><th>Thesis</th><th>Confidence</th><th>Strategy</th><th>Cadence</th><th>Universe</th></tr>';
    for (const r of refs.slice().reverse()) {
      html += '<tr>';
      html += '<td style="color:var(--text2)">' + ago(r.timestamp) + '</td>';
      html += '<td>' + (r.old_generation || '?') + ' &rarr; ' + (r.new_generation || '?') + '</td>';
      html += '<td style="white-space:normal;max-width:300px">' + esc(r.thesis || '') + '</td>';
      html += '<td>' + (r.confidence != null ? (r.confidence * 100).toFixed(0) + '%' : '—') + '</td>';
      html += '<td class="' + (r.strategy_ok ? 'green' : 'red') + '">' + (r.strategy_ok ? 'OK' : 'FAIL') + '</td>';
      html += '<td class="' + (r.cadence_ok ? 'green' : 'red') + '">' + (r.cadence_ok ? 'OK' : 'FAIL') + '</td>';
      html += '<td class="' + (r.universe_ok ? 'green' : 'red') + '">' + (r.universe_ok ? 'OK' : 'FAIL') + '</td>';
      html += '</tr>';
    }
    html += '</table>';
  }
  html += '</section>';

  // Memory
  html += '<section class="full">';
  html += '<h2>Strategy Memory</h2>';
  html += '<div class="memory-pane">' + esc(L.memory || 'No memory yet') + '</div>';
  html += '</section>';

  // close grid
  html += '</div>';

  // Log
  html += '<div style="background:var(--surface);padding:12px 20px;border-top:1px solid var(--border)">';
  html += '<h2 style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:8px">Monitor Log</h2>';
  html += '<div class="log-pane">';
  const lines = L.log_lines || [];
  for (const l of lines) {
    let cls = 'line';
    const ll = l.toLowerCase();
    if (ll.includes('warn') || ll.includes('⚠')) cls += ' warn';
    else if (ll.includes('error') || ll.includes('❌')) cls += ' err';
    else if (ll.includes('buy') || ll.includes('bought')) cls += ' buy';
    else if (ll.includes('sell') || ll.includes('sold')) cls += ' sell';
    html += '<div class="' + cls + '">' + esc(l) + '</div>';
  }
  if (lines.length === 0) html += '<div class="line">No log output yet</div>';
  html += '</div></div>';

  return html;
}

// ── Build overview pane (multi-leaf comparison) ──
function renderOverview(leaves, regime, benchmark) {
  let html = '';
  const bm = (benchmark || {}).current || {};
  const spy = bm.SPY || {};
  const btc = bm['BTC/USD'] || bm.BTC || {};

  // Leaf comparison cards
  html += '<div class="overview-grid">';
  for (const L of leaves) {
    const eq = L.portfolio.total_equity ?? L.portfolio.equity ?? L.portfolio.total_value ?? 100000;
    const eqHist = L.equity_history || [];
    const startEq = eqHist.length > 0 ? eqHist[0].equity : 100000;
    const leafPnl = eq - startEq;
    const leafPnlPct = startEq > 0 ? leafPnl / startEq : 0;
    const positions = L.portfolio.positions || {};
    const posCount = typeof positions === 'object' ? Object.keys(positions).length : 0;
    const tradeCount = (L.trades || []).length;
    const peakVal = (L.peak_equity || {}).peak || Math.max(eq, ...eqHist.map(e => e.equity || 0));
    const ddVal = peakVal > 0 ? ((eq - peakVal) / peakVal) : 0;
    const brain = L.brain || {};
    const state = L.effective_state || 'offline';

    html += '<div class="leaf-card">';
    html += '<h3><span class="dot ' + (L.process_alive ? 'alive' : 'dead') + '" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px"></span>';
    html += esc(L.leaf_name || L.leaf_id) + (L.leaf_description ? '<span class="leaf-type">' + esc(L.leaf_description) + '</span>' : '') + '</h3>';
    html += '<span class="status-pill status-' + state + '" style="margin-bottom:12px">' + state + '</span>';

    html += '<table style="margin-top:12px">';
    html += '<tr><td style="color:var(--text2)">Equity</td><td style="font-weight:600">' + fmtUsd(eq) + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">P&L</td><td class="' + clr(leafPnl) + '" style="font-weight:600">' + fmtUsd(leafPnl) + ' (' + pct(leafPnlPct) + ')</td></tr>';
    html += '<tr><td style="color:var(--text2)">Drawdown</td><td class="' + (ddVal < -0.02 ? 'red' : '') + '">' + pct(ddVal) + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Positions</td><td>' + posCount + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Trades</td><td>' + tradeCount + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Generation</td><td>' + (brain.generation || 0) + '</td></tr>';
    html += '<tr><td style="color:var(--text2)">Thesis</td><td style="white-space:normal">' + esc(brain.thesis || '—') + '</td></tr>';

    // Alpha vs benchmarks
    if (spy.buy_hold_return_pct != null && eqHist.length > 0) {
      const alphaSpy = (leafPnlPct * 100) - spy.buy_hold_return_pct;
      html += '<tr><td style="color:var(--text2)">Alpha vs SPY</td><td class="' + clr(alphaSpy) + '" style="font-weight:600">' + (alphaSpy >= 0 ? '+' : '') + fmt(alphaSpy, 2) + '%</td></tr>';
    }
    if (btc.buy_hold_return_pct != null && eqHist.length > 0) {
      const alphaBtc = (leafPnlPct * 100) - btc.buy_hold_return_pct;
      html += '<tr><td style="color:var(--text2)">Alpha vs BTC</td><td class="' + clr(alphaBtc) + '" style="font-weight:600">' + (alphaBtc >= 0 ? '+' : '') + fmt(alphaBtc, 2) + '%</td></tr>';
    }

    html += '</table>';
    html += '</div>';
  }
  html += '</div>';

  return html;
}

// ──────── MAIN RENDER ────────

let activeTab = null;  // track selected tab across refreshes

function renderAll() {
let html = '';

if (isMulti) {
  // ── MULTI-LEAF MODE ──
  const leaves = S.leaves;

  // Top bar
  html += '<div class="topbar">';
  html += '  <h1>ADAPTIVE ALPHA — MULTI-LEAF</h1>';
  html += '  <div class="meta">';
  html += '    ' + leaves.length + ' leaves';
  const orch = S.orchestrator || {};
  if (orch.cycle_count) html += '  &nbsp; · &nbsp; Cycle ' + orch.cycle_count;
  html += '    &nbsp; · &nbsp; ' + S.generated_at;
  html += '  </div>';
  html += '</div>';

  // Regime & Market Status bar (half / half)
  const regime = S.regime || {};
  const benchmark = S.benchmark || {};
  const regimeName = regime.regime || 'unknown';
  const probs = regime.probabilities || {};
  const bm = benchmark.current || {};
  const spy = bm.SPY || {};
  const btc = bm['BTC/USD'] || bm.BTC || {};

  html += '<div class="shared-bar">';

  // LEFT: Regime
  html += '<div style="flex:1">';
  html += '<div class="label">Market Regime</div>';
  html += '<div style="margin-top:4px">';
  html += '<span class="regime-badge regime-' + regimeName + '">' + regimeName.replace('_', ' ') + '</span>';
  html += '<span style="margin-left:12px;font-size:11px;color:var(--text2)">';
  html += 'Risk-On: ' + fmt((probs.risk_on || 0) * 100, 0) + '% ';
  html += '<span class="prob-bar" style="width:' + Math.round((probs.risk_on || 0) * 60) + 'px;background:var(--green)"></span> ';
  html += '&nbsp; Choppy: ' + fmt((probs.choppy || 0) * 100, 0) + '% ';
  html += '<span class="prob-bar" style="width:' + Math.round((probs.choppy || 0) * 60) + 'px;background:var(--yellow)"></span> ';
  html += '&nbsp; Risk-Off: ' + fmt((probs.risk_off || 0) * 100, 0) + '% ';
  html += '<span class="prob-bar" style="width:' + Math.round((probs.risk_off || 0) * 60) + 'px;background:var(--red)"></span>';
  html += '</span>';
  html += '</div></div>';

  // RIGHT: Market Status + Benchmarks
  html += '<div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:20px">';
  html += '<div id="market-status" style="text-align:right">';
  html += '<div class="label">Market Status</div>';
  html += '<div style="margin-top:4px"><span id="mkt-badge"></span> <span id="mkt-countdown" style="font-size:11px;color:var(--text2)"></span></div>';
  html += '</div>';
  html += '<div class="bench-item"><div class="label">SPY B&H</div>';
  html += '<div class="bench-val ' + clr(spy.buy_hold_return_pct || 0) + '">' + (spy.buy_hold_return_pct != null ? (spy.buy_hold_return_pct >= 0 ? '+' : '') + fmt(spy.buy_hold_return_pct, 2) + '%' : '—') + '</div></div>';
  html += '<div class="bench-item"><div class="label">BTC B&H</div>';
  html += '<div class="bench-val ' + clr(btc.buy_hold_return_pct || 0) + '">' + (btc.buy_hold_return_pct != null ? (btc.buy_hold_return_pct >= 0 ? '+' : '') + fmt(btc.buy_hold_return_pct, 2) + '%' : '—') + '</div></div>';
  html += '</div>'; // end right

  html += '</div>';

  // Leaf tabs
  html += '<div class="leaf-tabs">';
  html += '<div class="leaf-tab tab-overview active" data-tab="overview">Overview</div>';
  for (const L of leaves) {
    const dotCls = L.process_alive ? 'alive' : 'dead';
    html += '<div class="leaf-tab" data-tab="' + esc(L.leaf_id) + '">';
    html += '<span class="dot ' + dotCls + '"></span>';
    html += esc(L.leaf_name || L.leaf_id);
    if (L.leaf_description) html += ' <span style="color:var(--text2);font-weight:400">— ' + esc(L.leaf_description) + '</span>';
    html += '</div>';
  }
  html += '</div>';

  // Overview pane
  html += '<div class="leaf-pane active" id="pane-overview">';
  html += renderOverview(leaves, S.regime, S.benchmark);
  html += '</div>';

  // Per-leaf panes
  for (const L of leaves) {
    html += '<div class="leaf-pane" id="pane-' + L.leaf_id + '">';
    html += renderLeafContent(L);
    html += '</div>';
  }

} else {
  // ── SINGLE-LEAF MODE (legacy) ──

  const brain = S.brain || {};
  const cadence = S.cadence || {};
  const universe = S.universe || {};
  const activeSymbols = (universe.active || []).map(a => typeof a === 'string' ? a : a.symbol);
  const state = S.effective_state || 'offline';

  // Top bar
  html += '<div class="topbar">';
  html += '  <h1>ADAPTIVE ALPHA</h1>';
  html += '  <div class="meta">';
  html += '    <span class="status-pill status-' + state + '">' + state + '</span>';
  html += '    &nbsp; Gen ' + (brain.generation || 0);
  html += '    &nbsp; · &nbsp; Scan ' + (cadence.scan_interval_seconds || '—') + 's';
  html += '    &nbsp; · &nbsp; ' + activeSymbols.length + ' symbols';
  html += '  </div>';
  html += '</div>';

  // Regime bar if available
  const regime = S.regime || {};
  if (regime.regime) {
    const probs = regime.probabilities || {};
    html += '<div class="shared-bar">';
    html += '<div><span class="label">Regime</span> <span class="regime-badge regime-' + regime.regime + '">' + regime.regime.replace('_', ' ') + '</span></div>';
    html += '<div style="font-size:11px;color:var(--text2)">';
    html += 'Risk-On ' + fmt((probs.risk_on || 0) * 100, 0) + '%';
    html += ' &nbsp; Choppy ' + fmt((probs.choppy || 0) * 100, 0) + '%';
    html += ' &nbsp; Risk-Off ' + fmt((probs.risk_off || 0) * 100, 0) + '%';
    html += '</div>';
    html += '</div>';
  }

  html += renderLeafContent(S);
}

// Footer
html += '<div class="footer">';
html += '<span>Generated: ' + S.generated_at + '</span>';
html += '<span>' + (isMulti ? S.leaves.length + ' leaves' : 'Single mode') + ' · Live update: 60s</span>';
html += '</div>';

document.getElementById('app').innerHTML = html;

// Restore active tab after re-render
if (activeTab) switchTab(activeTab);

// Refresh market clock immediately after DOM rebuild
if (typeof updateMarketClock === 'function') updateMarketClock();
}

// Initial render
renderAll();

// C9 fix: event delegation instead of inline handlers
document.addEventListener('click', function(e) {
  const tab = e.target.closest('.leaf-tab');
  if (tab && tab.dataset.tab) {
    activeTab = tab.dataset.tab;
    switchTab(activeTab);
  }
});
document.addEventListener('mouseover', function(e) {
  if (e.target.classList.contains('chart-dot') && e.target.dataset.tip) {
    showTip(e, e.target.dataset.tip);
  }
});
document.addEventListener('mouseout', function(e) {
  if (e.target.classList.contains('chart-dot')) hideTip();
});

// Market clock — updates every second
function updateMarketClock() {
  var badge = document.getElementById('mkt-badge');
  var countdown = document.getElementById('mkt-countdown');
  if (!badge || !countdown) return;

  // Get current time in US Eastern
  var now = new Date();
  var etStr = now.toLocaleString('en-US', { timeZone: 'America/New_York' });
  var et = new Date(etStr);
  var day = et.getDay(); // 0=Sun, 6=Sat
  var h = et.getHours();
  var m = et.getMinutes();
  var mins = h * 60 + m; // minutes since midnight ET

  var openMin = 9 * 60 + 30;  // 9:30 AM ET
  var closeMin = 16 * 60;     // 4:00 PM ET

  var isWeekend = (day === 0 || day === 6);
  var isOpen = !isWeekend && mins >= openMin && mins < closeMin;
  var isPreMarket = !isWeekend && mins >= (4 * 60) && mins < openMin;
  var isAfterHours = !isWeekend && mins >= closeMin && mins < (20 * 60);

  // Badge
  if (isOpen) {
    badge.className = 'regime-badge';
    badge.style.cssText = 'background:rgba(63,185,80,0.15);color:var(--green);font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600';
    badge.textContent = 'OPEN';
  } else if (isPreMarket) {
    badge.className = 'regime-badge';
    badge.style.cssText = 'background:rgba(210,153,34,0.15);color:var(--yellow);font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600';
    badge.textContent = 'PRE-MARKET';
  } else if (isAfterHours) {
    badge.className = 'regime-badge';
    badge.style.cssText = 'background:rgba(210,153,34,0.15);color:var(--yellow);font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600';
    badge.textContent = 'AFTER HOURS';
  } else {
    badge.className = 'regime-badge';
    badge.style.cssText = 'background:rgba(248,81,73,0.15);color:var(--red);font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600';
    badge.textContent = 'CLOSED';
  }

  // Countdown — calculate target time
  var targetMins, label;
  if (isOpen) {
    targetMins = closeMin - mins;
    label = 'closes';
  } else if (isPreMarket) {
    targetMins = openMin - mins;
    label = 'opens';
  } else {
    // After hours, weekend, or before pre-market: count to next open
    // Find next weekday 9:30 ET
    var next = new Date(et);
    if (isAfterHours || mins >= closeMin) {
      next.setDate(next.getDate() + 1);
    }
    // Skip to Monday if weekend
    while (next.getDay() === 0 || next.getDay() === 6) {
      next.setDate(next.getDate() + 1);
    }
    next.setHours(9, 30, 0, 0);
    var diffMs = next.getTime() - et.getTime();
    var diffMins = Math.floor(diffMs / 60000);
    var dH = Math.floor(diffMins / 60);
    var dM = diffMins % 60;
    if (dH >= 24) {
      var dDays = Math.floor(dH / 24);
      var remH = dH % 24;
      countdown.textContent = 'opens in ' + dDays + 'd ' + remH + 'h ' + dM + 'm';
    } else {
      countdown.textContent = 'opens in ' + dH + 'h ' + dM + 'm';
    }
    return;
  }

  var cH = Math.floor(targetMins / 60);
  var cM = targetMins % 60;
  countdown.textContent = label + ' in ' + cH + 'h ' + cM + 'm';
}
updateMarketClock();
setInterval(updateMarketClock, 60000);

// Seamless auto-refresh: fetch new HTML, extract state, re-render in place
setInterval(function() {
  fetch(location.href + '?t=' + Date.now())
    .then(function(r) { return r.text(); })
    .then(function(newHtml) {
      const m = newHtml.match(/const S = (\{[\s\S]*?\});\s*\n/);
      if (!m) return;
      try {
        const newState = JSON.parse(m[1]);
        // Update state in place
        Object.keys(newState).forEach(function(k) { S[k] = newState[k]; });
        renderAll();
      } catch(e) { /* parse failed, skip this cycle */ }
    })
    .catch(function() { /* network error, skip */ });
}, 60000);
</script>
