<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Alpha — Live Dashboard</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --orange: #db6d28;
  --purple: #bc8cff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}

code, pre {
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar h1 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--accent);
}

.topbar .center {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 32px;
  font-size: 11px;
}

.topbar .right {
  display: flex;
  gap: 16px;
  align-items: center;
}

.status-pill {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-running { background: rgba(63,185,80,0.15); color: var(--green); }
.status-paused { background: rgba(210,153,34,0.15); color: var(--yellow); }
.status-stopped { background: rgba(248,81,73,0.15); color: var(--red); }
.status-offline { background: rgba(139,148,158,0.15); color: var(--text2); }

/* Market status */
.market-pill {
  display: inline-block; padding: 4px 12px; border-radius: 12px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.market-open { background: rgba(63,185,80,0.15); color: var(--green); }
.market-pre { background: rgba(188,140,255,0.15); color: var(--purple); }
.market-post { background: rgba(210,153,34,0.15); color: var(--yellow); }
.market-closed { background: rgba(139,148,158,0.15); color: var(--text2); }

/* ── Alert banner ── */
.alert-banner {
  background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  margin: 0 20px 16px 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: pulse-alert 2s ease-in-out infinite;
}
.alert-banner .alert-icon { font-size: 1.4em; }
.alert-banner .alert-text { flex: 1; }
.alert-banner .alert-time { font-size: 0.85em; opacity: 0.8; }

.alert-warning {
  background: linear-gradient(135deg, #ff8800 0%, #cc6600 100%);
}

@keyframes pulse-alert {
  0%,100% { opacity: 1; }
  50% { opacity: 0.85; }
}

/* ── Regime badge ── */
.regime-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-start;
}

.regime-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

.regime-risk_on { background: rgba(63,185,80,0.15); color: var(--green); }
.regime-choppy { background: rgba(210,153,34,0.15); color: var(--yellow); }
.regime-risk_off { background: rgba(248,81,73,0.15); color: var(--red); }

.prob-bar {
  width: 80px;
  height: 4px;
  border-radius: 2px;
  background: rgba(139,148,158,0.2);
  overflow: hidden;
}

.prob-bar-fill {
  height: 100%;
  background: var(--accent);
}

/* ── Leaf tabs ── */
.leaf-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  gap: 2px;
  position: sticky;
  top: var(--topbar-h, 52px);
  z-index: 99;
}

.leaf-tab {
  padding: 10px 20px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  position: relative;
}

.leaf-tab:hover {
  color: var(--text);
  background: rgba(88,166,255,0.04);
}

.leaf-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.leaf-tab .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}

.leaf-tab .dot.alive { background: var(--green); }
.leaf-tab .dot.dead { background: var(--red); }

.tab-overview { color: var(--purple) !important; }
.tab-overview.active { border-bottom-color: var(--purple) !important; }

/* ── Metrics row ── */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}

.metric {
  padding: 16px 20px;
  background: var(--surface);
}

.metric label {
  display: block;
  font-size: 10px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.metric .val {
  font-size: 20px;
  font-weight: 700;
  font-family: 'SF Mono', monospace;
}

.green { color: var(--green); }
.red { color: var(--red); }
.yellow { color: var(--yellow); }

/* ── Content panes ── */
.leaf-pane {
  display: none;
}

.leaf-pane.active {
  display: block;
}

/* ── Main grid ── */
.pane-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}

.pane-grid.full {
  grid-template-columns: 1fr;
}

.pane-grid.three {
  grid-template-columns: 1fr 1fr 1fr;
}

.pane-grid > section {
  background: var(--surface);
  padding: 16px 20px;
}

section h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ── Tables ── */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th {
  text-align: left;
  color: var(--text2);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 4px 8px 8px 0;
  font-weight: 600;
}

td {
  padding: 5px 8px 5px 0;
  border-top: 1px solid rgba(48,54,61,0.5);
  white-space: nowrap;
  font-family: 'SF Mono', monospace;
}

.table-wrap { overflow-x: auto; }

tr:hover td {
  background: rgba(88,166,255,0.04);
}

/* ── Daily P&L bar chart (diverging from zero) ── */
.daily-bar-chart {
  display: flex;
  gap: 6px;
  margin: 12px 0;
  padding: 0 4px;
  align-items: stretch;
}
.daily-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}
.daily-bar-bars {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 80px;
  position: relative;
}
.daily-bar-top {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.daily-bar-bottom {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.daily-bar-zero {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  height: 1px;
  background: var(--border);
}
.daily-bar-fill {
  width: 70%;
  min-width: 6px;
  border-radius: 2px;
  transition: opacity 0.15s;
}
.daily-bar-fill:hover { opacity: 0.75; }
.daily-bar-fill.positive { background: var(--green); }
.daily-bar-fill.negative { background: var(--red); }
.daily-bar-label {
  font-size: 9px;
  font-family: monospace;
  margin-top: 2px;
  white-space: nowrap;
}
.daily-bar-date {
  font-size: 9px;
  color: var(--text2);
  margin-top: 3px;
}

/* ── Equity chart SVG ── */
.chart-wrap {
  background: var(--surface);
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.chart-wrap h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.chart-svg {
  width: 100%;
  height: 250px;
}

.chart-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart-area { opacity: 0.08; }
.chart-grid { stroke: var(--border); stroke-width: 0.5; }
.chart-axis-label { fill: var(--text2); font-size: 10px; }

/* ── Risk gauge ── */
.risk-gauge {
  display: inline-block;
  height: 10px;
  width: 80px;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid var(--border);
  vertical-align: middle;
  position: relative;
  cursor: help;
}
.risk-gauge-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to right, var(--red), var(--yellow) 40%, var(--green));
  opacity: 0.25;
}
.risk-gauge-marker {
  position: absolute;
  top: -1px;
  bottom: -1px;
  width: 4px;
  border-radius: 2px;
  z-index: 2;
  transform: translateX(-50%);
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
}

/* ── Collapsible trades ── */
.trade-day-header {
  cursor: pointer;
  padding: 8px 12px;
  background: rgba(88,166,255,0.05);
  border-radius: 4px;
  margin: 8px 0 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}

.trade-day-header:hover {
  background: rgba(88,166,255,0.1);
}

.trade-day-header .caret {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-right: 1px solid currentColor;
  border-bottom: 1px solid currentColor;
  transform: rotate(-45deg);
  transition: transform 0.15s;
}

.trade-day-header.collapsed .caret {
  transform: rotate(45deg);
}

.trade-day-content {
  margin: 8px 0;
  max-height: 400px;
  overflow-y: auto;
}

.trade-day-content.collapsed {
  display: none;
}

.trade-row {
  display: grid;
  grid-template-columns: 56px 36px 40px 62px 68px 1fr auto;
  gap: 6px;
  font-size: 11px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(48,54,61,0.3);
  align-items: center;
}

.trade-row:last-child {
  border-bottom: none;
}

/* ── Sector stacked bar ── */
.sector-bar {
  display: flex;
  height: 20px;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border);
  margin: 12px 0;
}

.sector-segment {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 600;
  color: #fff;
  transition: opacity 0.15s;
  min-width: 20px;
}

.sector-segment:hover {
  opacity: 0.8;
}

.sector-tech { background: #7b61ff; }
.sector-energy { background: #ff6b6b; }
.sector-healthcare { background: #51cf66; }
.sector-consumer { background: #ffa500; }
.sector-industrial { background: #4c72b0; }
.sector-index { background: #9467bd; }
.sector-leveraged { background: #d62728; }
.sector-crypto { background: #ff7f0e; }
.sector-other { background: var(--border); }

/* ── Signal bar ── */
.signal-bar {
  display: inline-block;
  height: 8px;
  border-radius: 4px;
  min-width: 2px;
  vertical-align: middle;
}

.signal-pos { background: var(--green); }
.signal-neg { background: var(--red); }

/* ── Reflection timeline ── */
.reflection-timeline {
  display: flex;
  gap: 8px;
  margin: 12px 0;
  overflow-x: auto;
  padding-bottom: 8px;
}

.reflection-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  transition: all 0.15s;
}

.reflection-dot:hover {
  transform: scale(1.3);
}

/* ── Log pane ── */
.log-pane {
  background: var(--bg);
  padding: 12px 16px;
  max-height: 300px;
  overflow-y: auto;
  font-size: 11px;
  line-height: 1.6;
  font-family: 'SF Mono', monospace;
  border-top: 1px solid var(--border);
}

.log-pane .line { color: var(--text2); }
.log-pane .line.warn { color: var(--yellow); }
.log-pane .line.err { color: var(--red); }
.log-pane .line.buy { color: var(--green); }
.log-pane .line.sell { color: var(--orange); }

/* ── Memory pane ── */
.memory-pane {
  background: var(--bg);
  padding: 12px 16px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text2);
  white-space: pre-wrap;
  max-height: 400px;
  overflow-y: auto;
}

.memory-pane h1, .memory-pane h2, .memory-pane h3 {
  color: var(--accent);
  font-size: 13px;
  margin: 8px 0 4px;
}

/* ── Footer ── */
.footer {
  padding: 8px 24px;
  font-size: 10px;
  color: var(--text2);
  background: var(--surface);
  border-top: 1px solid var(--border);
  text-align: center;
}

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  body { font-size: 12px; }

  .topbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 14px;
  }

  .topbar h1 { font-size: 14px; }

  .topbar .center {
    flex-direction: column;
    width: 100%;
    gap: 8px;
  }

  .topbar .right {
    width: 100%;
    justify-content: space-between;
  }

  .leaf-tabs {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 8px;
    gap: 0;
    scrollbar-width: none;
  }
  .leaf-tabs::-webkit-scrollbar { display: none; }
  .leaf-tab { padding: 8px 12px; font-size: 11px; white-space: nowrap; }

  .metrics {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .metric {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  .pane-grid {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .pane-grid > section {
    padding: 12px 14px;
  }

  .chart-svg { height: 180px; }

  .trade-row {
    grid-template-columns: repeat(3, 1fr);
    font-size: 10px;
  }

  /* Tables: horizontal scroll wrapper */
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 -14px;
    padding: 0 14px;
  }
  .table-wrap table { min-width: 520px; }

  /* Tables → card layout on mobile */
  .pos-table thead, .compare-table thead { display: none; }
  .pos-table, .compare-table { min-width: 0 !important; }
  .pos-table tr, .compare-table tr {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .pos-table td, .compare-table td {
    border: none;
    padding: 2px 0;
    white-space: normal;
  }
  .pos-table td::before, .compare-table td::before {
    content: attr(data-label);
    display: block;
    font-size: 9px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: system-ui, sans-serif;
  }
  /* First cell (name) spans full width */
  .pos-table td:first-child, .compare-table td:first-child {
    grid-column: 1 / -1;
    font-weight: 700;
    font-size: 13px;
  }

  .footer { flex-direction: column; gap: 4px; }
}

@media (max-width: 400px) {
  .topbar h1 { font-size: 12px; }
  .metric .val { font-size: 16px; }
  .leaf-tab { padding: 6px 10px; font-size: 10px; }
  .trade-row { grid-template-columns: 1fr; }
}
</style>
</head>

or off-hours risk management.", "analysis": "Gen 16 backtest showed 10.42% return but entered some trades against strong negative news (e.g. LLY -5.4% on drug trial failure, META -3.3% on earnings miss). These were fundamental breakdowns, not statistical dislocations \u2014 MR strategy should avoid them. Gen 17 adds sentiment gate: negative sentiment dampens entries (-15% to -25%), neutral/positive sentiment during pullback confirms contrarian thesis (+8%). Also added weekend crypto dampening (evolvable by Opus): signals <0.50 blocked, >=0.50 dampened to 55%. Backtest improved to 11.00% total return. Sentiment gate activated 9 times: 5 boosted, 2 dampened, 1 blocked.", "strategy_changes": "Added sentiment gate in _stock_signal() (negative news = dampen/block, positive = boost), weekend crypto dampening in _crypto_signal() (weak signals blocked, strong dampened to 55%)", "cadence_changes": "No cadence changes", "universe_changes": "No universe changes", "confidence": 0.78, "strategy_ok": true, "cadence_ok": false, "universe_ok": false, "mode": "manual_backtest_iteration", "backtest_results": {"total_return_pct": 11.0, "sentiment_gate_stats": {"total_activations": 9, "boosted_entries": 5, "dampened_entries": 2, "blocked_entries": 1}, "improvement_from_gen16": "+0.58% total return"}}, {"timestamp": "2026-03-23T21:34:01.069391", "old_generation": 17, "new_generation": 18, "thesis": "Gen 18 Leaf A: Contrarian fear-harvesting MR. Inverted regime multiplier \u2014 risk_off now BOOSTS entries instead of suppressing them. New data integration: spy_trend for trend quality, risk_appetite (HYG/TLT) as credit confirmation, market_breadth for sector-level filtering. Lowered composite threshold in extreme fear (F&G<15). Sentiment delta tracking for active deterioration detection. Day 1 lesson: 0.6% signal rate was too conservative \u2014 MR must embrace fear.", "analysis": "Day 1 of live trading completed with Leaf A producing a single profitable trade (XOM +$210) but an extremely low signal rate of 0.6% (3 non-zero signals out of 500 predictions across 17 cycles). The core problem was the regime multiplier suppressing entries during risk_off \u2014 exactly when a mean-reversion strategy should be most active. With Fear & Greed at 8 (extreme fear), VIX at 25.5 (90th percentile), and the regime classifier correctly reading risk_off at 46.4% confidence, the strategy was d", "strategy_changes": "1. Inverted regime multiplier: risk_off 0.70\u21921.10, risk_on 1.00\u21920.85. 2. New fear_trend_override: allows entries on falling-EMA50 stocks when dislocation>0.30 and credit>0.3. 3. Adaptive composite threshold: 0.20\u21920.16 in extreme fear (F&G<15), 0.18 in fear. 4. Credit confirmation factor: risk_appetite>0.5 boosts +8%, <-0.5 dampens -15%. 5. Sector breadth filter: sector_quality_score uses SECTOR_MAP to check if symbol sector is healthy. 6. SPY trend caution: deep SPY downtrend (<-0.7) dampens signal by 12%. 7. Sentiment delta tracking: deteriorating sentiment (delta<-0.15) adds -10%, improving (>+0.10) adds +6%. 8. Crypto: risk_off now 0.90 instead of 0.70, with credit confirmation added.", "cadence_changes": "No changes \u2014 cadence v16 parameters are appropriate.", "universe_changes": "No changes \u2014 30 active symbols provides sufficient coverage.", "confidence": 0.75, "strategy_ok": true, "cadence_ok": true, "universe_ok": true, "mode": "import"}, {"timestamp": "2026-03-24T17:45:30.066286-04:00", "old_generation": 18, "new_generation": 19, "thesis": "Gen 19 Leaf A: Breadth-gated contrarian MR. Stronger sector filtering in weak breadth regimes, extended hold windows (22/32 bars), 12% position sizing for diversification, momentum continuation exit to cut bleeding positions.", "analysis": "Gen 18 delivered -$5.89 on 9 live trades (44% WR) but exposed critical structural issues. The primary leak was tech sector entries in deeply negative breadth: GOOGL lost $238 and META lost $89, both in XLK which was -2.85% below EMA20. The sector_quality penalty of 0.80x was insufficient to block these entries. Meanwhile, energy trades (XOM +$210, UNP +$135, RTX +$72, ETH +$169) were consistently profitable, confirming the thesis that credit-constructive + weak-breadth = sector rotation into ene", "strategy_changes": "1. Breadth-aware sector gate: 0.60x penalty (was 0.80x) for weak sectors when breadth < -0.5. 2. Raised min_comp to 0.28 for non-energy stocks in deeply negative sectors. 3. Extended time exits: stale 16\u219222, hard 24\u219232 bars. 4. Momentum continuation exit: cut losers still falling after 8 bars. 5. Mode identifiers updated to v19.", "cadence_changes": "Position size reduced 15%\u219212% to prevent exposure ceiling blocking crypto opportunities. All other cadence parameters unchanged \u2014 they're working well.", "universe_changes": "No changes. Current 30-instrument universe provides good coverage.", "confidence": 0.72, "strategy_ok": true, "cadence_ok": true, "universe_ok": true, "mode": "import"}, {"timestamp": "2026-03-25T16:37:22.079658-04:00", "old_generation": 20, "new_generation": 21, "thesis": "Gen 20 Leaf A: Defensive-broadened contrarian MR. Consumer staples and healthcare join energy as preferred fear-regime hunting grounds. Graduated time exits (18/22/32 bars) cut dead-weight positions faster. Softer breadth gate for defensive sectors. Faster momentum continuation cut at 6 bars/-0.8%.", "analysis": "Gen 20 delivered a strong +$393 total PnL across 18 round trips (55.6% WR), with Gen 20-specific trades producing +$189 from 8 trades at 62.5% WR. The key insight is that consumer defensives outperformed energy in this extreme fear regime: KO (+$118) and COST (+$63) were the top winners, while energy holdings (EOG -$27, XLE -$10, CVX -$23) mostly ran to 22-bar time_stale exits with marginal losses. This signals that the fear-harvesting thesis works, but the energy-only focus was too narrow \u2014 mon", "strategy_changes": "1) DEFENSIVE_SECTORS set (XLE, XLP, XLV) with dedicated bonus logic in extreme fear. 2) SECTOR_MAP corrected: COST moved from XLY to XLP (consumer staples). 3) _sector_quality now takes fear_greed param \u2014 defensives get 1.08-1.18x boost when F&G<20. 4) Breadth gate softened: defensive sectors get min_comp=0.22 (not 0.28) in weak breadth. 5) New 'defensive_fear_override' trend filter path for defensive sectors at ds>0.25 + F&G<20. 6) Graduated time exits: 18-bar bleeding exit (pnl<-0.5%), 22-bar stale, 32-bar hard. 7) Momentum continuation cut tightened: bh>=6 + pnl<-0.8% + rsi<38 (was bh>=8 + pnl<-1% + rsi<35). 8) SPY trend caution reduced to 0.08x for defensive sectors (was 0.12x for all). 9) New 'defensive_fear_bonus' factor: +10% boost for defensive sectors in risk_off + F&G<20.", "cadence_changes": "No cadence changes. The current cadence (v21) with 12% position sizing, 8 max positions, 80% max exposure, 3% stock stops, and 10-min scan intervals is well calibrated for this regime. The 22-bar hold window is now handled by graduated exits in the strategy code itself.", "universe_changes": "No universe changes. The 30-symbol universe with energy, tech, defensives, industrials, and crypto provides adequate coverage. The strategy's sector rotation logic will naturally favor defensives without needing to add more symbols.", "confidence": 0.72, "strategy_ok": true, "cadence_ok": true, "universe_ok": true, "mode": "import"}, {"timestamp": "2026-03-26T03:35:13.569674-04:00", "old_generation": 22, "new_generation": 23, "thesis": "Gen 23 Leaf A: Value-defensive contrarian MR. Sharper sector filtering: tech faces harsher gates in risk_off (GOOGL/META/AMZN were biggest losers). VIX percentile calibration replaces raw VIX. Sector-aware time exits give defensives more patience, cut tech faster. High-beta ATR filter.", "analysis": "Gen 20 ran for a full trading day in extreme fear conditions (F&G=10, VIX 87th pct, breadth -0.818). The results clearly bifurcate by sector: large-cap value/defensive names (XOM +$210, KO +$118, UNP + // ── Format helpers ──
function fmt(n, dec=2) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtUsd(n) { return '$' + fmt(n); }
function pct(n) { return (n >= 0 ? '+' : '') + fmt(n * 100, 2) + '%'; }
function clr(n) { return n >= 0 ? 'green' : 'red'; }
function ago(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

// ── SPY return helper ──
function spyReturnSince(startTs) {
  const spyRaw = S.spy_history || [];
  if (spyRaw.length < 2) return null;
  // Find earliest SPY price at or after startTs
  let first = null, last = null;
  for (const s of spyRaw) {
    const t = new Date(s.timestamp).getTime();
    if (t >= startTs && first === null) first = s.price;
    if (t >= startTs) last = s.price;
  }
  if (first && last && first > 0) return (last - first) / first;
  return null;
}

// ── Sector mapping ──
function getSector(symbol) {
  const map = {
    'tech': ['AAPL', 'MSFT', 'GOOGL', 'AMZN', 'META', 'NVDA', 'MU', 'INTC'],
    'energy': ['XOM', 'CVX', 'COP', 'EOG', 'XLE'],
    'healthcare': ['LLY', 'MRK', 'JNJ'],
    'consumer': ['KO', 'PG', 'COST', 'SBUX'],
    'industrial': ['CAT', 'UNP', 'LMT', 'RTX'],
    'index': ['SPY', 'QQQ', 'IWM'],
    'leveraged': ['TQQQ', 'UCO'],
    'crypto': [],
  };
  const sym = (symbol || '').toUpperCase();
  for (const [sector, symbols] of Object.entries(map)) {
    if (symbols.includes(sym)) return sector;
  }
  if (sym.includes('/USD') || sym === 'BTC' || sym === 'ETH') return 'crypto';
  return 'other';
}

// ── Render daily P&L bars (diverging from zero line) ──
function renderDailyBars(dailyStats, last=7) {
  if (!dailyStats || dailyStats.length === 0) return '<p style="color: var(--text2);">No data</p>';

  const recent = dailyStats.slice(-last);
  const maxAbs = Math.max(...recent.map(d => Math.abs(d.daily_pnl)), 1);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let html = '<div class="daily-bar-chart">';
  for (const d of recent) {
    const pnl = d.daily_pnl || 0;
    const ret = d.daily_return || 0;
    const barPct = Math.max(4, (Math.abs(pnl) / maxAbs) * 100);
    const isPos = pnl >= 0;
    const cls = pnl > 0 ? 'positive' : pnl < 0 ? 'negative' : 'positive';
    const valStr = (ret >= 0 ? '+' : '') + (ret * 100).toFixed(2) + '%';
    const valColor = isPos ? 'var(--green)' : 'var(--red)';
    const dt = d.date ? new Date(d.date + 'T12:00:00') : null;
    const dayLabel = dt ? days[dt.getDay()] : '';
    const dateLabel = d.date ? d.date.slice(5) : '';
    const trades = d.trades || 0;
    const wr = d.win_rate != null ? Math.round(d.win_rate * 100) : 0;

    html += '<div class="daily-bar-col" title="' + d.date + ': ' + valStr + ' | ' + trades + ' trades | ' + wr + '% WR">';
    html += '<div class="daily-bar-bars">';
    html += '<div class="daily-bar-zero"></div>';

    if (isPos) {
      // Positive: bar grows upward from center
      html += '<div class="daily-bar-top"><div class="daily-bar-fill positive" style="height:' + barPct + '%"></div></div>';
      html += '<div class="daily-bar-bottom"></div>';
    } else {
      // Negative: bar grows downward from center
      html += '<div class="daily-bar-top"></div>';
      html += '<div class="daily-bar-bottom"><div class="daily-bar-fill negative" style="height:' + barPct + '%"></div></div>';
    }

    html += '</div>'; // bars
    html += '<div class="daily-bar-label" style="color:' + valColor + '">' + valStr + '</div>';
    html += '<div class="daily-bar-date">' + dayLabel + ' ' + dateLabel + '</div>';
    html += '</div>'; // col
  }
  html += '</div>';
  return html;
}

  if (spyNorm.length === data.length) {
    spyPath = '<path d="M';
    for (let i = 0; i < spyNorm.length; i++) {
      spyPath += (i === 0 ? '' : ' L') + cx(i).toFixed(1) + ' ' + cy(spyNorm[i]).toFixed(1);
    }
    spyPath += '" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5"/>';
  }

  // Main equity path
  let eqPath = 'M';
  for (let i = 0; i < data.length; i++) {
    eqPath += (i === 0 ? '' : ' L') + cx(i).toFixed(1) + ' ' + cy(data[i]).toFixed(1);
  }

  const areaPath = eqPath + ' L ' + cx(data.length - 1).toFixed(1) + ' ' + (padT + plotH) + ' L ' + padL + ' ' + (padT + plotH) + ' Z';
  const lineIsGreen = data[data.length - 1] >= startEq;
  const lineColor = lineIsGreen ? 'var(--green)' : 'var(--red)';
  const baseY = cy(startEq);

  // Legend
  let legend = '<text x="' + (padL + 8) + '" y="14" fill="' + color + '" font-size="10" font-family="system-ui">' + label + '</text>';
  if (spyNorm.length > 0) {
    const lx = padL + 8 + label.length * 7 + 12;
    legend += '<line x1="' + lx + '" y1="11" x2="' + (lx + 10) + '" y2="11" stroke="var(--text2)" stroke-width="1.5" stroke-dasharray="3 2"/>';
    legend += '<text x="' + (lx + 14) + '" y="14" fill="var(--text2)" font-size="10" font-family="system-ui">SPY</text>';
  }

  const gradId = 'grad-' + (chartId || label).replace(/[^a-zA-Z0-9]/g, '');
  const svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">'
    + '<defs><linearGradient id="' + gradId + '" x1="0%" y1="0%" x2="0%" y2="100%">'
    + '<stop offset="0%" style="stop-color: ' + lineColor + '; stop-opacity: 0.15"/>'
    + '<stop offset="100%" style="stop-color: ' + lineColor + '; stop-opacity: 0"/>'
    + '</linearGradient></defs>'
    + gridHtml
    + '<line x1="' + padL + '" y1="' + baseY.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + baseY.toFixed(1) + '" stroke="var(--text2)" stroke-width="0.5" stroke-dasharray="4 3"/>'
    + spyPath
    + '<path d="' + areaPath + '" fill="url(#' + gradId + ')"/>'
    + '<path d="' + eqPath + '" class="chart-line" stroke="' + lineColor + '"/>'
    + xLabels
    + legend
    + '</svg>';

  // Range buttons
  const ranges = [['1d', '1D'], ['1w', '1W'], ['1m', '1M'], ['all', 'All']];
  let btns = '<div style="display:flex;gap:4px;">';
  for (const [key, lbl] of ranges) {
    const isActive = selectedRange === key;
    const style = isActive
      ? 'background:var(--accent);color:#fff;border-color:var(--accent)'
      : 'background:transparent;color:var(--text2);border-color:var(--border)';
    btns += '<button onclick="setChartRange(&quot;' + chartId + '&quot;,&quot;' + key + '&quot;)" style="font-size:11px;padding:2px 10px;border-radius:4px;border:1px solid;cursor:pointer;font-family:inherit;' + style + '">' + lbl + '</button>';
  }
  btns += '</div>';

  return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    + '<span style="color:var(--text2);font-size:11px">' + data.length + ' data points</span>'
    + btns + '</div>' + svg;
}

// ── Group trades by day ──
function groupTradesByDay(trades) {
  const groups = {};
  for (const t of trades) {
    const date = (t.timestamp || t.time || '').slice(0, 10);
    if (!groups[date]) groups[date] = [];
    groups[date].push(t);
  }
  return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
}

// ── Render trades by day ──
function renderTradesByDay(trades) {
  const groups = groupTradesByDay(trades);
  if (groups.length === 0) return '<p style="color: var(--text2);">No trades</p>';

  let html = '';
  for (let i = 0; i < groups.length; i++) {
    const [date, dayTrades] = groups[i];
    const wins = dayTrades.filter(t => (t.pnl || 0) > 0).length;
    const totalPnl = dayTrades.reduce((sum, t) => sum + (t.pnl || 0), 0);
    const winRate = dayTrades.length > 0 ? (wins / dayTrades.length) : 0;
    const isFirst = i === 0;

    html += `<div class="trade-day-header ${!isFirst ? 'collapsed' : ''}" onclick="this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')">
      <span><strong>${date}</strong> | ${dayTrades.length} trades | ${(totalPnl >= 0 ? '+' : '-')}$${fmt(Math.abs(totalPnl), Math.abs(totalPnl) < 10 ? 2 : 0)} P&L | ${pct(winRate)} win</span>
      <span class="caret"></span>
    </div>
    <div class="trade-day-content ${!isFirst ? 'collapsed' : ''}">`;

    for (const t of dayTrades) {
      const side = (t.side || '').toUpperCase();
      const tPnl = t.pnl != null ? t.pnl : (t.realized_pnl != null ? t.realized_pnl : null);
      const hasPnl = tPnl != null;
      const shares = t.shares || t.qty || t.quantity || '—';
      const tFactors = t.factors || [];
      const reason = t.reason || '';
      const factorHtml = tFactors.length > 0
        ? tFactors.slice(0, 3).map(f => '<span style="display:inline-block;padding:1px 5px;margin:1px;border-radius:6px;font-size:9px;background:rgba(88,166,255,0.08);color:var(--text2)">'
          + (f.name || '') + '</span>').join('')
        : (reason ? '<span style="font-size:10px;color:var(--text2)">' + reason + '</span>' : '');
      const priceStr = '$' + fmt(t.price || 0, (t.price || 0) < 10 ? 2 : 0);
      const pnlStr = hasPnl ? (tPnl >= 0 ? '+' : '') + '$' + fmt(Math.abs(tPnl), Math.abs(tPnl) < 10 ? 2 : 0) : '—';
      html += `<div class="trade-row">
        <div style="font-weight:600">${t.symbol || '?'}</div>
        <div class="${side === 'BUY' ? 'green' : 'red'}">${side}</div>
        <div style="font-family:monospace">${shares}</div>
        <div style="font-family:monospace">${priceStr}</div>
        <div class="${hasPnl ? clr(tPnl) : ''}" style="font-family:monospace;font-weight:600">${pnlStr}</div>
        <div style="white-space:normal">${factorHtml}</div>
        <div style="color: var(--text2); font-size: 10px;">${ago(t.timestamp || t.time)}</div>
      </div>`;
    }

    html += '</div>';
  }
  return html;
}

// ── Render sector bar ──
function renderSectorBar(positions) {
  const sectors = {};
  let total = 0;

  for (const [sym, pos] of Object.entries(positions || {})) {
    const sector = getSector(sym);
    const val = pos.market_value || 0;
    sectors[sector] = (sectors[sector] || 0) + val;
    total += val;
  }

  if (total === 0) return '<div style="color: var(--text2);">No positions</div>';

  let html = '<div class="sector-bar">';
  for (const [sector, val] of Object.entries(sectors)) {
    const pct = (val / total) * 100;
    if (pct > 5) {
      html += `<div class="sector-segment sector-${sector}" style="flex: ${pct};" title="${sector}: ${fmt(val)}">
        ${sector.toUpperCase()}
      </div>`;
    }
  }
  html += '</div>';
  return html;
}

// ── Render single leaf ──
function renderLeaf(leaf) {
  const eq = leaf.portfolio.total_equity || leaf.portfolio.equity || 100000;
  const cash = leaf.portfolio.cash || 0;
  const positions = leaf.portfolio.positions || {};
  const posCount = Object.keys(positions).length;
  const trades = leaf.trades || [];
  const brain = leaf.brain || {};
  const daily = leaf.daily_stats || [];
  const metrics = leaf.live_metrics || {};
  const eqHist = leaf.equity_history || [];

  const initial = leaf.initial_capital || 100000;
  const pnl = eq - initial;
  const pnlPct = initial > 0 ? pnl / initial : 0;

  // Alpha vs SPY for this leaf
  const leafStartTs = eqHist.length > 0 && eqHist[0].timestamp ? new Date(eqHist[0].timestamp).getTime() : null;
  const leafSpyRet = leafStartTs ? spyReturnSince(leafStartTs) : null;
  const leafAlpha = leafSpyRet !== null ? pnlPct - leafSpyRet : null;

  let html = '';

  // Strategy name subtitle
  if (leaf.leaf_description) {
    html += `<div style="background:var(--surface);padding:10px 20px 0;font-size:13px;color:var(--text2);font-style:italic;border-bottom:1px solid var(--border)">${leaf.leaf_description} &mdash; Gen ${(brain.generation || 0)}</div>`;
  }

  // Metrics row
  html += `<div class="metrics">
    <div class="metric"><label>Equity</label><div class="val">${fmtUsd(eq)}</div></div>
    <div class="metric"><label>P&L</label><div class="val ${clr(pnl)}">${fmtUsd(pnl)}</div></div>
    <div class="metric"><label>Return</label><div class="val ${clr(pnlPct)}">${pct(pnlPct)}</div></div>
    <div class="metric"><label>Alpha vs SPY</label><div class="val ${leafAlpha !== null ? clr(leafAlpha) : ''}">${leafAlpha !== null ? pct(leafAlpha) : '—'}</div></div>
    <div class="metric"><label>Sharpe</label><div class="val">${fmt(metrics.sharpe || 0, 2)}</div></div>
    <div class="metric"><label>Win Rate</label><div class="val">${pct(metrics.win_rate || 0)}</div></div>
    <div class="metric"><label>Profit Factor</label><div class="val">${fmt(metrics.profit_factor || 0, 2)}</div></div>
  </div>`;

  // Daily P&L
  html += `<div class="pane-grid full"><section>
    <h2>Daily P&L (Last 10)</h2>
    ${renderDailyBars(daily, 10)}
  </section></div>`;

  // Equity curve
  const leafColor = leaf.leaf_id === 'leaf_a' ? '#58a6ff' : '#bc8cff';
  html += `<div class="chart-wrap">
    <h2>Equity Curve</h2>
    ${renderEquityChart(eqHist, leaf.leaf_name, leafColor, 'eq-' + leaf.leaf_id)}
  </div>`;

  // Positions with risk gauges
  html += `<div class="pane-grid full"><section>
    <h2>Open Positions (${posCount})</h2>`;
  if (posCount === 0) {
    html += '<div style="color: var(--text2);">All cash — no open positions</div>';
  } else {
    html += `<table class="pos-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Shares</th>
          <th>Avg Entry</th>
          <th>Current</th>
          <th>Mkt Value</th>
          <th>P&L</th>
          <th>Bars</th>
          <th>Risk</th>
        </tr>
      </thead>
      <tbody>`;

    const posEntries = Object.entries(positions).sort((a,b) => Math.abs(b[1].market_value||0) - Math.abs(a[1].market_value||0));
    for (const [sym, pos] of posEntries) {
      const shares = pos.shares || 0;
      const avg = pos.avg_price || 0;
      const curr = pos.current_price || 0;
      const mv = pos.market_value || (curr * shares);
      const upnl = pos.unrealized_pnl != null ? pos.unrealized_pnl : (curr - avg) * shares;
      const upnlPct = avg > 0 ? (curr - avg) / avg : 0;
      const barsHeld = pos.bars_held != null ? pos.bars_held : '—';

      // Risk gauge: position between stop loss and take profit
      const sl = pos.stop_loss_price || avg * 0.975;
      const tp = pos.take_profit_price || avg * 1.035;
      const gaugeRange = tp - sl;
      const gaugePos = gaugeRange > 0 ? Math.max(0, Math.min(1, (curr - sl) / gaugeRange)) : 0.5;
      const gaugeColor = gaugePos > 0.6 ? 'var(--green)' : gaugePos < 0.3 ? 'var(--red)' : 'var(--yellow)';

      html += `<tr>
        <td data-label="Symbol" style="font-weight:600">${sym}</td>
        <td data-label="Shares" style="font-family:monospace">${fmt(shares, shares < 1 ? 4 : 0)}</td>
        <td data-label="Avg Entry" style="font-family:monospace">${fmtUsd(avg)}</td>
        <td data-label="Current" style="font-family:monospace">${fmtUsd(curr)}</td>
        <td data-label="Mkt Value" style="font-family:monospace">${fmtUsd(mv)}</td>
        <td data-label="P&L" class="${clr(upnl)}" style="font-family:monospace;font-weight:600">${fmtUsd(upnl)} <span style="opacity:0.6">(${pct(upnlPct)})</span></td>
        <td data-label="Bars Held" style="font-family:monospace">${barsHeld}</td>
        <td data-label="Risk">
          <div class="risk-gauge" title="SL: ${fmtUsd(sl)} | TP: ${fmtUsd(tp)}">
            <div class="risk-gauge-bg"></div>
            <div class="risk-gauge-marker" style="left: ${gaugePos * 100}%; background: ${gaugeColor}"></div>
          </div>
        </td>
      </tr>`;
    }

    html += `</tbody></table>`;
  }
  html += `</section></div>`;

  // Sector exposure
  if (posCount > 0) {
    html += `<div class="pane-grid"><section>
      <h2>Sector Exposure</h2>
      ${renderSectorBar(positions)}
    </section><section>
      <h2>Position Summary</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
        <div><span style="color:var(--text2)">Cash:</span> <span style="font-family:monospace;font-weight:600">${fmtUsd(cash)}</span></div>
        <div><span style="color:var(--text2)">Invested:</span> <span style="font-family:monospace;font-weight:600">${fmtUsd(eq - cash)}</span></div>
        <div><span style="color:var(--text2)">Exposure:</span> <span style="font-family:monospace;font-weight:600">${pct((eq - cash) / eq)}</span></div>
        <div><span style="color:var(--text2)">Avg Bars Held:</span> <span style="font-family:monospace;font-weight:600">${fmt(metrics.avg_bars_held || 0, 1)}</span></div>
      </div>
    </section></div>`;
  }

  // Trades
  html += `<div class="pane-grid full"><section>
    <h2>Trades by Day</h2>
    ${renderTradesByDay(trades)}
  </section></div>`;

  // Signals
  const preds = leaf.predictions || [];
  const latestBySymbol = {};
  for (const p of preds) { latestBySymbol[p.symbol] = p; }
  const dedupedPreds = Object.values(latestBySymbol).sort((a, b) => Math.abs(b.signal || 0) - Math.abs(a.signal || 0));
  const activeSignals = dedupedPreds.filter(p => Math.abs(p.signal || 0) > 0.001);

  html += `<div class="pane-grid"><section>
    <h2>Latest Signals (${activeSignals.length} active)</h2>`;
  if (dedupedPreds.length === 0) {
    html += '<div style="color: var(--text2);">No signals yet</div>';
  } else {
    html += `<table><thead><tr><th>Symbol</th><th>Signal</th><th></th><th>Factors</th></tr></thead><tbody>`;
    for (const p of dedupedPreds) {
      const sig = p.signal || 0;
      if (Math.abs(sig) < 0.001) continue;
      const factors = (p.meta && p.meta.factors) ? p.meta.factors : [];
      const barW = Math.min(Math.abs(sig) * 80, 80);
      const barCls = sig >= 0 ? 'signal-pos' : 'signal-neg';
      const factorHtml = factors.map(f =>
        '<span style="display:inline-block;padding:1px 6px;margin:1px;border-radius:6px;font-size:9px;background:rgba(88,166,255,0.1);color:var(--accent)">'
        + (f.name || '') + ' <span class="' + clr(f.delta || 0) + '">' + (f.delta >= 0 ? '+' : '') + fmt(f.delta || 0, 2) + '</span></span>'
      ).join('');
      const dimStyle = Math.abs(sig) < 0.1 ? 'opacity:0.5;' : '';
      html += `<tr style="${dimStyle}">
        <td style="font-weight:600">${p.symbol || '?'}</td>
        <td class="${clr(sig)}" style="font-family:monospace">${sig >= 0 ? '+' : ''}${fmt(sig, 3)}</td>
        <td><span class="signal-bar ${barCls}" style="width:${barW}px"></span></td>
        <td style="white-space:normal;max-width:350px">${factorHtml || '<span style="color:var(--text2)">—</span>'}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</section>`;

  // Strategy Brain + Reflections
  const reflections = leaf.reflections || [];
  const backtest = brain.backtest_summary || leaf.latest_backtest || {};
  html += `<section>
    <h2>Strategy Brain — Gen ${brain.generation || '?'}</h2>
    <div style="font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:12px">${(brain.thesis || 'No thesis').slice(0, 300)}</div>`;
  if (Object.keys(backtest).length > 0) {
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:11px;margin-bottom:12px">
      ${backtest.return_pct != null ? '<div><span style="color:var(--text2)">Backtest Return:</span> <span class="' + clr(backtest.return_pct) + '">' + pct(backtest.return_pct/100) + '</span></div>' : ''}
      ${backtest.sharpe != null ? '<div><span style="color:var(--text2)">Backtest Sharpe:</span> ' + fmt(backtest.sharpe, 2) + '</div>' : ''}
      ${backtest.win_rate != null ? '<div><span style="color:var(--text2)">Backtest WR:</span> ' + pct(backtest.win_rate/100) + '</div>' : ''}
      ${backtest.profit_factor != null ? '<div><span style="color:var(--text2)">Backtest PF:</span> ' + fmt(backtest.profit_factor, 2) + '</div>' : ''}
    </div>`;
  }
  if (reflections.length > 0) {
    html += `<div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Recent Reflections</div>`;
    for (const r of reflections.slice(-5).reverse()) {
      const conf = r.confidence != null ? fmt(r.confidence * 100, 0) + '%' : '—';
      html += `<div style="font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text2)">${ago(r.timestamp)}</span>
        Gen ${r.old_generation} → ${r.new_generation}
        <span style="color:var(--accent)">conf: ${conf}</span>
      </div>`;
    }
  }
  html += `</section></div>`;

  // Log
  html += `<div class="log-pane">`;
  for (const line of (leaf.log_lines || []).slice(-20)) {
    const cls = line.includes('ERROR') ? 'err' : line.includes('WARN') ? 'warn' : '';
    html += `<div class="line ${cls}">${line}</div>`;
  }
  html += `</div>`;

  return html;
}

// ── Render overview tab ──
function renderOverview() {
  if (!S.leaves || S.leaves.length === 0) return '<p>No leaves</p>';

  let totalEq = 0, totalPnl = 0;
  for (const leaf of S.leaves) {
    const eq = leaf.portfolio.total_equity || leaf.portfolio.equity || 100000;
    const initial = leaf.initial_capital || 100000;
    totalEq += eq;
    totalPnl += (eq - initial);
  }

  const totalInitial = S.leaves.reduce((sum, l) => sum + (l.initial_capital || 100000), 0);
  const pnlPct = totalInitial > 0 ? totalPnl / totalInitial : 0;

  // Compute combined alpha vs SPY (use earliest leaf start)
  let earliestTs = Infinity;
  for (const leaf of S.leaves) {
    const hist = leaf.equity_history || [];
    if (hist.length > 0 && hist[0].timestamp) {
      const t = new Date(hist[0].timestamp).getTime();
      if (t < earliestTs) earliestTs = t;
    }
  }
  const spyRet = earliestTs < Infinity ? spyReturnSince(earliestTs) : null;
  const alpha = spyRet !== null ? pnlPct - spyRet : null;

  let html = `<div class="metrics">
    <div class="metric"><label>Combined Equity</label><div class="val">${fmtUsd(totalEq)}</div></div>
    <div class="metric"><label>Combined P&L</label><div class="val ${clr(totalPnl)}">${fmtUsd(totalPnl)}</div></div>
    <div class="metric"><label>Combined Return</label><div class="val ${clr(pnlPct)}">${pct(pnlPct)}</div></div>
    <div class="metric"><label>SPY Return</label><div class="val">${spyRet !== null ? pct(spyRet) : '—'}</div></div>
    <div class="metric"><label>Alpha vs SPY</label><div class="val ${alpha !== null ? clr(alpha) : ''}">${alpha !== null ? pct(alpha) : '—'}</div></div>
  </div>`;

  // Leaf comparison table
  html += `<div class="pane-grid full"><section>
    <h2>Leaf Comparison</h2>
    <div class="table-wrap">
    <table class="compare-table" style="font-size: 11px;">
      <thead>
        <tr>
          <th>Leaf</th>
          <th>Equity</th>
          <th>P&L</th>
          <th>Alpha</th>
          <th>Sharpe</th>
          <th>Win Rate</th>
          <th>Profit Factor</th>
          <th>Gen</th>
        </tr>
      </thead>
      <tbody>`;

  for (const leaf of S.leaves) {
    const eq = leaf.portfolio.total_equity || leaf.portfolio.equity || 100000;
    const initial = leaf.initial_capital || 100000;
    const pnl = eq - initial;
    const ret = initial > 0 ? pnl / initial : 0;
    const metrics = leaf.live_metrics || {};
    const brain = leaf.brain || {};
    const hist = leaf.equity_history || [];
    const startTs = hist.length > 0 && hist[0].timestamp ? new Date(hist[0].timestamp).getTime() : null;
    const lSpyRet = startTs ? spyReturnSince(startTs) : null;
    const lAlpha = lSpyRet !== null ? ret - lSpyRet : null;

    html += `<tr>
      <td data-label="Leaf">${leaf.leaf_name}<div style="font-size:10px;color:var(--text2);font-weight:400">${leaf.leaf_description || ''}</div></td>
      <td data-label="Equity">${fmtUsd(eq)}</td>
      <td data-label="P&L" class="${clr(pnl)}">${fmtUsd(pnl)}</td>
      <td data-label="Alpha" class="${lAlpha !== null ? clr(lAlpha) : ''}">${lAlpha !== null ? pct(lAlpha) : '—'}</td>
      <td data-label="Sharpe">${fmt(metrics.sharpe || 0, 2)}</td>
      <td data-label="Win Rate">${pct(metrics.win_rate || 0)}</td>
      <td data-label="Profit Factor">${fmt(metrics.profit_factor || 0, 2)}</td>
      <td data-label="Gen">${brain.generation || 'N/A'}</td>
    </tr>`;
  }

  html += `</tbody></table></div></section></div>`;

  // Daily P&L strip for combined view
  const allDaily = {};
  for (const leaf of S.leaves) {
    for (const d of (leaf.daily_stats || [])) {
      if (!allDaily[d.date]) allDaily[d.date] = { date: d.date, daily_pnl: 0, daily_return: 0, trades: 0, wins: 0, _open: 0, _close: 0 };
      allDaily[d.date].daily_pnl += d.daily_pnl;
      allDaily[d.date]._open += (d.open_equity || 0);
      allDaily[d.date]._close += (d.close_equity || 0);
      allDaily[d.date].trades += d.trades;
      allDaily[d.date].wins += d.wins;
    }
  }
  const combinedDaily = Object.values(allDaily).map(d => {
    d.daily_return = d._open > 0 ? (d._close - d._open) / d._open : 0;
    return d;
  }).sort((a,b) => a.date.localeCompare(b.date));

  html += `<div class="pane-grid full"><section>
    <h2>Combined Daily P&L</h2>
    ${renderDailyBars(combinedDaily, 10)}
  </section></div>`;

  // Overlaid equity chart (leaves + SPY) with range selector
  if (S.leaves.length >= 1) {
    const ovChartId = 'eq-overview';
    const ovRange = _chartRanges[ovChartId] || 'all';
    const ovNow = new Date();
    const ovCutoffs = { '1d': 1, '1w': 7, '1m': 30 };
    const ovCutDays = ovCutoffs[ovRange];

    const colors = ['#58a6ff', '#bc8cff', '#3fb950', '#d29922'];
    html += `<div class="chart-wrap"><h2>Equity Comparison</h2>`;

    // Filter each leaf's history by range
    const allHistories = S.leaves.map((l, i) => {
      let hist = l.equity_history || [];
      if (ovCutDays) {
        const filtered = hist.filter(e => e.timestamp && (ovNow - new Date(e.timestamp)) < ovCutDays * 86400000);
        if (filtered.length >= 2) hist = filtered;
      }
      return { data: hist, color: colors[i % colors.length], name: l.leaf_name, initial: l.initial_capital || 100000 };
    });
    const maxLen = Math.max(...allHistories.map(h => h.data.length));

    if (maxLen >= 2) {
      const w = 900, h = 270, padL = 65, padR = 20, padT = 25, padB = 35;
      const plotW = w - padL - padR, plotH = h - padT - padB;

      // Build shared time axis from all leaves
      let globalMinT = Infinity, globalMaxT = -Infinity;
      for (const hist of allHistories) {
        for (const e of hist.data) {
          if (e.timestamp) {
            const t = new Date(e.timestamp).getTime();
            if (t < globalMinT) globalMinT = t;
            if (t > globalMaxT) globalMaxT = t;
          }
        }
      }
      const timeRange = globalMaxT - globalMinT || 1;

      let allVals = [];
      for (const hist of allHistories) {
        for (const e of hist.data) allVals.push(e.equity || 0);
      }

      // Build normalized SPY series on shared time axis
      const spyRaw = S.spy_history || [];
      let spyPoints = []; // [{t, v}]
      const refInitial = allHistories[0].data[0] ? allHistories[0].data[0].equity : allHistories[0].initial;
      if (spyRaw.length >= 2) {
        const spyInRange = spyRaw.filter(s => {
          const t = new Date(s.timestamp).getTime();
          return t >= globalMinT && t <= globalMaxT;
        });
        if (spyInRange.length >= 2) {
          const anchor = spyInRange[0].price;
          for (const s of spyInRange) {
            const v = refInitial * (s.price / anchor);
            spyPoints.push({ t: new Date(s.timestamp).getTime(), v });
            allVals.push(v);
          }
        }
      }

      const min = Math.min(...allVals) * 0.9998;
      const max = Math.max(...allVals) * 1.0002;
      const range = max - min || 1;

      // Map timestamp to x, value to y
      function cxT(t) { return padL + ((t - globalMinT) / timeRange) * plotW; }
      function cyO(v) { return padT + plotH - ((v - min) / range) * plotH; }

      // Range buttons
      const ovRanges = [['1d', '1D'], ['1w', '1W'], ['1m', '1M'], ['all', 'All']];
      let ovBtns = '<div style="display:flex;gap:4px;">';
      for (const [key, lbl] of ovRanges) {
        const isActive = ovRange === key;
        const style = isActive
          ? 'background:var(--accent);color:#fff;border-color:var(--accent)'
          : 'background:transparent;color:var(--text2);border-color:var(--border)';
        ovBtns += '<button onclick="setChartRange(&quot;' + ovChartId + '&quot;,&quot;' + key + '&quot;)" style="font-size:11px;padding:2px 10px;border-radius:4px;border:1px solid;cursor:pointer;font-family:inherit;' + style + '">' + lbl + '</button>';
      }
      ovBtns += '</div>';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
        + '<span style="color:var(--text2);font-size:11px">' + maxLen + ' data points</span>'
        + ovBtns + '</div>';

      let svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">';

      // Grid
      for (let i = 0; i <= 4; i++) {
        const v = min + (range * i / 4);
        const y = cyO(v);
        svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) + '" stroke="var(--border)" stroke-width="0.5"/>';
        svg += '<text x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '" fill="var(--text2)" font-size="9" text-anchor="end" font-family="monospace">$' + Math.round(v).toLocaleString() + '</text>';
      }

      // X-axis time labels
      const nXLabels = 6;
      for (let i = 0; i < nXLabels; i++) {
        const t = globalMinT + (timeRange * i / (nXLabels - 1));
        const lbl = new Date(t).toISOString().replace('T', ' ').slice(5, 16);
        svg += '<text x="' + cxT(t).toFixed(1) + '" y="' + (h - 6) + '" fill="var(--text2)" font-size="9" text-anchor="middle" font-family="monospace">' + lbl + '</text>';
      }

      // Baseline
      svg += '<line x1="' + padL + '" y1="' + cyO(refInitial).toFixed(1) + '" x2="' + (w - padR) + '" y2="' + cyO(refInitial).toFixed(1) + '" stroke="var(--text2)" stroke-width="0.5" stroke-dasharray="4 3"/>';

      // SPY line (plotted by timestamp)
      if (spyPoints.length >= 2) {
        let spyPath = 'M';
        for (let i = 0; i < spyPoints.length; i++) {
          spyPath += (i === 0 ? '' : ' L') + cxT(spyPoints[i].t).toFixed(1) + ' ' + cyO(spyPoints[i].v).toFixed(1);
        }
        svg += '<path d="' + spyPath + '" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5"/>';
      }

      // Leaf lines (plotted by timestamp — each starts at its own first data point)
      for (const hist of allHistories) {
        const d = hist.data;
        if (d.length < 2) continue;
        let path = 'M';
        for (let i = 0; i < d.length; i++) {
          const t = new Date(d[i].timestamp || 0).getTime();
          path += (i === 0 ? '' : ' L') + cxT(t).toFixed(1) + ' ' + cyO(d[i].equity).toFixed(1);
        }
        svg += '<path d="' + path + '" class="chart-line" stroke="' + hist.color + '"/>';
      }

      // Legend
      let legendX = padL + 8;
      for (const hist of allHistories) {
        svg += '<circle cx="' + legendX + '" cy="13" r="4" fill="' + hist.color + '"/>';
        svg += '<text x="' + (legendX + 8) + '" y="16" fill="var(--text2)" font-size="10" font-family="system-ui">' + hist.name + '</text>';
        legendX += hist.name.length * 7 + 25;
      }
      if (spyPoints.length > 0) {
        svg += '<line x1="' + legendX + '" y1="13" x2="' + (legendX + 14) + '" y2="13" stroke="var(--text2)" stroke-width="1.5" stroke-dasharray="3 2"/>';
        svg += '<text x="' + (legendX + 18) + '" y="16" fill="var(--text2)" font-size="10" font-family="system-ui">SPY</text>';
      }

      svg += '</svg>';
      html += svg;
    }
    html += `</div>`;
  }

  return html;
}

// ── Main render ──
function renderAll() {
  let html = '';

  // Top bar
  const mkt = S.market_status || {};
  const mktCls = 'market-' + (mkt.status || 'closed');
  html += `<div class="topbar">
    <h1>ADAPTIVE ALPHA</h1>
    <div class="center">${renderRegimeBar()}</div>
    <div class="right">
      <span class="market-pill ${mktCls}" title="${mkt.detail || ''}">${mkt.label || 'CLOSED'}</span>
      <span class="status-pill status-${S.effective_state || 'offline'}">${(S.effective_state || 'offline').toUpperCase()}</span>
      <span style="color: var(--text2); font-size: 11px;">${S.generated_at || '—'}</span>
    </div>
  </div>`;

  // Alerts
  html += renderAlerts();

  // Tabs
  html += `<div class="leaf-tabs">
    <div class="leaf-tab tab-overview ${activeTabId === 'overview' ? 'active' : ''}" data-tab="overview" onclick="switchTab('overview')">
      <span style="color: var(--purple); font-weight: 600;">OVERVIEW</span>
    </div>`;

  if (isMulti && S.leaves) {
    for (const leaf of S.leaves) {
      const alive = leaf.process_alive ? 'alive' : 'dead';
      html += `<div class="leaf-tab ${activeTabId === leaf.leaf_id ? 'active' : ''}" data-tab="${leaf.leaf_id}" onclick="switchTab('${leaf.leaf_id}')">
        <span class="dot ${alive}"></span>${leaf.leaf_name}
      </div>`;
    }
  }

  html += `</div>`;

  // Content panes
  html += `<div id="pane-overview" class="leaf-pane ${activeTabId === 'overview' ? 'active' : ''}">${renderOverview()}</div>`;

  if (isMulti && S.leaves) {
    for (const leaf of S.leaves) {
      html += `<div id="pane-${leaf.leaf_id}" class="leaf-pane ${activeTabId === leaf.leaf_id ? 'active' : ''}">${renderLeaf(leaf)}</div>`;
    }
  }

  // Footer
  html += `<div class="footer">
    <span>Adaptive Alpha Live Dashboard</span>
    <span>Last updated: ${S.generated_at || '—'}</span>
  </div>`;

  document.getElementById('app').innerHTML = html;
}

// Initial render
renderAll();

// Sync sticky tab offset to topbar height
function syncTopbarH() {
  const tb = document.querySelector('.topbar');
  if (tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
}
syncTopbarH();
window.addEventListener('resize', syncTopbarH);

// Auto-refresh every 60s
setInterval(function() {
  fetch(location.href + '?t=' + Date.now())
    .then(r => r.text())
    .then(html => {
      const m = html.match(/const S = (\{[\s\S]*?\});\s*\n/);
      if (!m) return;
      try {
        const newState = JSON.parse(m[1]);
        const scrollY = window.scrollY;
        Object.keys(newState).forEach(k => { S[k] = newState[k]; });
        renderAll();
        window.scrollTo(0, scrollY);
      } catch (e) {}
    })
    .catch(() => {});
}, 60000);
</script>
